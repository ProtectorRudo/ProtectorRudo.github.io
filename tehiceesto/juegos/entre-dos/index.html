<script>
'use strict';
const BANK=[{"id":0,"stage":0,"q":"¿Con qué plan te tentarían más un viernes a la noche?","a":"Salir sin saber adónde vamos","b":"Quedarnos en casa con algo rico","talk":"¿Cuál fue la última cita improvisada que disfrutaron?"},{"id":4,"stage":0,"q":"¿Qué recuerdo de ustedes revivirías?","a":"La primera cita","b":"El primer beso","talk":"¿Qué detalle recuerda cada uno de ese día?"},{"id":9,"stage":0,"q":"¿Qué te conquista más rápido?","a":"Que me hagan reír sin parar","b":"Que me presten atención de verdad","talk":"¿Qué fue lo primero que te conquistó?"},{"id":31,"stage":1,"q":"¿Qué te gustaría saber del principio de su historia?","a":"Qué pensó de mí al conocerme","b":"Cuándo sintió que esto era especial","talk":"¿Se acuerdan de ese momento?"},{"id":54,"stage":1,"q":"Si pudieran hacerse una pregunta sincera, ¿cuál sería?","a":"«¿Qué te hace más feliz conmigo?»","b":"«¿Qué podría hacer mejor por vos?»","talk":"¿Se animan a responder las dos?"},{"id":59,"stage":1,"q":"¿Cuál sería la confesión más valiosa?","a":"«Al principio me daba miedo enamorarme»","b":"«Ahora me imagino un futuro con vos»","talk":"¿Qué sintieron cuando empezó todo?"},{"id":61,"stage":2,"q":"¿Qué tipo de beso preferís?","a":"Uno lento que se hace esperar","b":"Uno espontáneo que sorprende","talk":"¿Cuál recuerdan especialmente?"},{"id":65,"stage":2,"q":"¿Qué gesto te hace perder la concentración?","a":"Un beso en el cuello","b":"Una caricia lenta en la espalda","talk":"¿Hay algún gesto que te sorprenda siempre?"},{"id":66,"stage":2,"q":"¿Qué te daría más vergüenza confesar?","a":"Un momento en que te encontré irresistible","b":"Una idea atrevida para nuestra próxima cita","talk":"¿Te animás a contarla sin dar vueltas?"}];

function btn(text,action,style=''){return `<button type="button" class="btn ${style}" data-action="${action}">${text}</button>`}
function v(){try{if(navigator.vibrate)navigator.vibrate(18)}catch(e){}}
function sound(name){if(S.muted)return;try{const ctx=new (window.AudioContext||window.webkitAudioContext)();let t=ctx.currentTime;const notes=name==='win'?[392,494,587]:[294];notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);const start=t+i*.1;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.055,start+.025);g.gain.exponentialRampToValueAtTime(.0001,start+.23);o.start(start);o.stop(start+.24)});setTimeout(()=>ctx.close().catch(()=>{}),800)}catch(e){}}
function toast(message){let t=document.getElementById('toast');t.textContent=message;t.hidden=false;setTimeout(()=>{if(t.textContent===message)t.hidden=true},2700)}
function celebrate(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const root=document.getElementById('ambient');root.innerHTML='';for(let i=0;i<17;i++){let p=document.createElement('span');p.className='particle';p.textContent=i%3?'♥':'✦';p.style.left=(8+Math.random()*84)+'%';p.style.fontSize=(13+Math.random()*19)+'px';p.style.setProperty('--dx',(Math.random()*150-75)+'px');p.style.animationDelay=(Math.random()*.35)+'s';root.append(p)}setTimeout(()=>{root.innerHTML=''},2100)}

function begin(){saveNames();S.deck=drawDeck();S.index=0;S.matches=0;S.answers=[null,null];S.stage=0;navigate('stage')}

function advance(){S.index++;S.answers=[null,null];if(S.index>=S.deck.length)return navigate('end');const st=Math.floor(S.index/(S.rounds/3));if(st!==S.stage){S.stage=st;navigate('stage')}else navigate('choose1')}

function summary(){const pct=Math.round(S.matches/S.rounds*100),a=S.names[0],b=S.names[1];return `♥ ENTRE DOS · ${a} + ${b}\nCoincidimos ${S.matches} de ${S.rounds} veces (${pct}%).\n¿Te animás a descubrir cuánto coincidimos nosotros?`}
async function share(){let value=summary();try{if(navigator.share){await navigator.share({title:'Nuestro resultado · ENTRE DOS',text:value});return}if(navigator.clipboard&&location.protocol!=='file:'){await navigator.clipboard.writeText(value);toast('Resultado copiado para compartir');return}}catch(e){if(e.name==='AbortError')return}let box=document.createElement('textarea');box.value=value;document.body.append(box);box.select();try{document.execCommand('copy');toast('Resultado copiado para compartir')}catch(e){toast('Podés compartir el resultado con una captura de pantalla')}box.remove()}
function render(){const q=S.deck[S.index];let h='';let total=S.rounds;const progress=Math.round(S.index/total*100);
if(S.page==='home')h=`<div class="enter"><div class="eyebrow">DEMO GRATIS · UNA PASADA DE 9 CARTAS</div><h1 class="title">¿Qué<br><span class="pink">preferís?</span></h1><p class="lead">Dos personas, dos opciones y elecciones secretas. Una probadita gratuita con nueve cartas fijas. La sorpresa continúa en el juego completo.</p><div class="panel hero-card"><div class="deck-illustration"><span class="illustration-card one"></span><span class="illustration-card two">♥</span></div><strong>¿Coinciden tanto como creen?</strong><p class="mini">Una persona elige A o B y pasa el celular. La otra elige sin mirar. Después se revelan las dos respuestas.</p></div>${btn('Empezar nuestra partida ↗','setup')}<p class="small center">9 cartas de muestra · Siempre las mismas · Sin registro</p></div>`;
else if(S.page==='setup')h=`<div class="enter"><div class="eyebrow">Antes de abrir la primera carta</div><h2 class="title-sm">Poneles nombre<br><span class="pink">a los cómplices.</span></h2><p class="lead">Un solo celular. No hay respuestas correctas. Cada vez que jueguen la demo se repetirán las mismas 9 cartas.</p><div class="form-field"><label for="name0">Primera persona</label><input id="name0" autocomplete="off" maxlength="22" value="${escapeHtml(S.names[0])}" placeholder="Tu nombre"></div><div class="form-field"><label for="name1">Segunda persona</label><input id="name1" autocomplete="off" maxlength="22" value="${escapeHtml(S.names[1])}" placeholder="Su nombre"></div><div class="form-field"><label>Esta demo tiene 9 cartas fijas. Cuando vuelvan a jugar encontrarán las mismas, en el mismo orden.</label></div><div class="steps"><span>✧ Romper el hielo</span><b>→</b><span>♡ Sin filtro</span><b>→</b><span>♥ Picante</span></div>${btn('Empezar el recorrido ↗','begin')}${btn('Volver','home','plain')}</div>`;
else if(S.page==='stage'){let st=STAGES[S.stage];h=`<div class="scene-center stage-${S.stage} enter"><div class="orb">${st.icon}</div><div class="eyebrow">Capítulo ${S.stage+1} de 3</div><h2 class="title-sm">${st.title}</h2><p class="lead">${st.desc}</p><div class="badge-level">${st.name}</div></div>${btn('Abrir la primera carta →','choose1')}<p class="small center">Respuestas privadas. Sin apuro.</p>`}
else if(S.page==='choose1'||S.page==='choose2'){let isFirst=S.page==='choose1';let who=isFirst?first():second();h=`<div class="enter"><div class="q-head"><span>Turno de ${escapeHtml(S.names[who])}</span><span>Carta ${S.index+1} / ${total}</span></div><div class="progress"><span style="width:${progress}%"></span></div><div class="q-category">${STAGES[S.stage].name} · Elegí tu carta</div><div class="prompt">${escapeHtml(q.q)}</div><button class="option" type="button" data-action="select" data-player="${who}" data-value="0" data-suit="A ♥">${escapeHtml(q.a)}</button><div class="or">o</div><button class="option b" type="button" data-action="select" data-player="${who}" data-value="1" data-suit="B ♠">${escapeHtml(q.b)}</button><p class="small center">${isFirst?'Elegí sin decirlo en voz alta. La otra persona no verá tu respuesta.':'Elegí lo que vos preferís. No estás adivinando la elección anterior.'}</p></div>`}
else if(S.page==='handoff')h=`<div class="scene-center enter"><div class="orb">♧</div><div class="eyebrow">Respuesta guardada · Sin pistas</div><h2 class="title-sm">Ahora le toca a<br><span class="pink">${escapeHtml(S.names[second()])}</span></h2><p class="lead">Pasale el celular y dejá que elija su propia carta. Nadie verá la primera respuesta hasta la revelación.</p></div>${btn('Ya tengo el celular →','choose2')}<p class="small center">No se trata de adivinar: se trata de descubrirse.</p>`;
else if(S.page==='reveal'){const same=S.answers[0]===S.answers[1];h=`<div class="enter"><div class="eyebrow">La revelación · Carta ${S.index+1} de ${total}</div><div class="reveal-panel"><div class="reveal-big">${same?'♥ ✨ ♥':'✦ ♡ ✦'}</div><h2>${same?'¡Qué conexión!':'¡Linda diferencia!'}</h2><div class="prompt-mini">${escapeHtml(q.q)}</div><div class="answer-box"><span>${escapeHtml(S.names[0])} eligió</span><strong>${escapeHtml(S.answers[0]===0?q.a:q.b)}</strong></div><div class="answer-box"><span>${escapeHtml(S.names[1])} eligió</span><strong>${escapeHtml(S.answers[1]===0?q.a:q.b)}</strong></div></div><div class="talk-card"><b>Una pregunta para charlar</b><p>${escapeHtml(q.talk)}</p></div><div class="stat-line"><span>Coincidencias hasta ahora</span><strong>${S.matches} / ${S.index+1}</strong></div>${btn(S.index===total-1?'Descubrir nuestro resultado →':'Siguiente carta →','advance')}<p class="small center">${same?'Coincidieron. ¡Pero la mejor parte es contarse por qué!':'No coincidir también da lugar a una gran conversación.'}</p></div>`}
else if(S.page==='end'){const pct=Math.round(S.matches/total*100);let title=pct>=75?'Conexión que se nota':pct>=40?'Química con sorpresas':'Dos mundos que se descubren';let caption=pct>=75?'Coincidieron mucho, pero todavía quedan historias por contar.':pct>=40?'No piensan igual en todo, y ahí también vive la magia.':'Las diferencias pueden ser el comienzo de las mejores charlas.';h=`<div class="enter"><div class="eyebrow">Final de la demo · La historia recién empieza</div><h2 class="title-sm">${title}<span class="pink">.</span></h2><div class="scene-center" style="padding:7px 0 0"><div class="orb" style="width:110px;height:110px;font-size:55px">♥</div><div class="final-percent">${pct}%</div><p class="lead center">${escapeHtml(S.names[0])} y ${escapeHtml(S.names[1])} coincidieron ${S.matches} de ${total} veces.</p></div><div class="final-ribbon"><div><strong>${S.matches}</strong> coincidencias</div><div><strong>${total-S.matches}</strong> sorpresas</div></div><div class="panel"><p class="lead" style="font-size:14px;margin:0">${caption} <strong>¿Cuál respuesta les sorprendió más?</strong></p></div><div style="height:17px"></div>${btn('Compartir nuestro resultado ↗','share')}<a class="btn buy" href="/juegos/pack#comprar">Conseguir los tres juegos · $25.000 ↗</a><p class="small center">Esta demo siempre repite las mismas 9 preguntas. El juego completo tiene 90 y permite descubrir otras en cada partida.</p>${btn('Volver a jugar las mismas 9 cartas ↻','begin','secondary')}${btn('Cambiar nombres','setup','plain')}</div>`}
app.innerHTML=h}
app.addEventListener('click',ev=>{const b=ev.target.closest('button[data-action]');if(!b)return;const action=b.dataset.action;switch(action){case 'home':navigate('home');break;case 'setup':navigate('setup');break;case 'rounds':saveNames();S.rounds=Number(b.dataset.value);render();break;case 'begin':begin();break;case 'choose1':navigate('choose1');break;case 'choose2':navigate('choose2');break;case 'select':select(Number(b.dataset.player),Number(b.dataset.value));break;case 'swap':swap();break;case 'advance':advance();break;case 'share':share();break;}});
document.getElementById('sound').addEventListener('click',()=>{S.muted=!S.muted;const b=document.getElementById('sound');b.textContent=S.muted?'♪̸':'♫';b.setAttribute('aria-label',S.muted?'Activar sonidos':'Silenciar sonidos');if(!S.muted)sound('win')});
render();
</script></body></html>

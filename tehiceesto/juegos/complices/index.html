function shell(content){$('app').innerHTML=`<div class="app"><header class="nav"><a class="logo" href="/" aria-label="Ir a Te Hice Esto">TE HICE <span>ESTO ♥</span></a><div class="nav-right"><span class="tag">${IS_DEMO?'DEMO · 1 RETO':'EDICIÓN COMPLETA'}</span><button class="sound" onclick="toggleAudio()" aria-label="${game.muted?'Activar':'Silenciar'} sonidos">${game.muted?'♩':'♫'}</button></div></header><main class="appear">${content}</main><div class="foot">CÓMPLICES · Una experiencia original de TeHiceEsto.com<br>Un solo celular, dos personas y siete secretos.</div></div>`;window.scrollTo({top:0,behavior:'instant'});}
let ctx=null;
function tone(mode='good'){if(game.muted)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ctx=ctx||new A();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime;const pattern=mode==='good'?[523,659,784]:mode==='bad'?[260,220]:[450];pattern.forEach((hz,i)=>{let osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='sine';osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,t+i*.13);gain.gain.exponentialRampToValueAtTime(.05,t+i*.13+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+i*.13+.15);osc.start(t+i*.13);osc.stop(t+i*.13+.17);});}catch(e){}}
function buzz(n=30){try{navigator.vibrate?.(n)}catch(e){}}
function toggleAudio(){game.muted=!game.muted;render()}
function toast(str){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=str;document.body.append(el);clearTimeout(game.toastTimer);game.toastTimer=setTimeout(()=>el.remove(),2450)}
function confetti(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;let p=document.createElement('div');p.id='confetti';document.body.append(p);for(let i=0;i<22;i++){let e=document.createElement('span');e.className='particle';e.textContent=['✦','♡','✧','✿'][i%4];e.style.left=(17+Math.random()*66)+'%';e.style.top=(35+Math.random()*25)+'%';e.style.setProperty('--dx',(Math.random()*320-160)+'px');e.style.setProperty('--dy',(-60-Math.random()*310)+'px');e.style.setProperty('--duration',(0.85+Math.random()*.9)+'s');e.style.setProperty('--color',['#f4d5a1','#eaa5b4','#fff1cb'][i%3]);p.append(e)}setTimeout(()=>p.remove(),1900)}
function button(label,action,style=''){return `<button class="btn ${style}" onclick="${action}">${label}</button>`}
function marks(){return `<div class="stage-grid" aria-label="${game.done} de 7 cerraduras abiertas">${TITLES.map((s,i)=>`<div class="stage-dot ${i<game.done?'on':i===game.done?'next':'locked'}" title="${safe(s)}">${i<game.done?'✓':i+1}</div>`).join('')}</div>`}
function stageHead(kicker,title,summary){return `<div class="challenge-head"><span class="ribbon">CERRADURA ${game.done+1} / 7</span><div class="smallcap" style="margin-top:19px">${kicker}</div><h2 class="display">${title}</h2><p class="lead">${summary}</p>${marks()}</div>`}
function resetTimers(){if(game.timer){clearInterval(game.timer);game.timer=null}if(game.raf){cancelAnimationFrame(game.raf);game.raf=null}}
function screen(id){resetTimers();game.screen=id;render()}
function getNames(){let a=$('n1'),b=$('n2');if(a){game.names=[a.value.trim().slice(0,22)||'Persona 1',b.value.trim().slice(0,22)||'Persona 2']}}
function start(){getNames();game.done=0;game.entry=[];game.tries=0;game.startedAt=Date.now();game.solved=0;game.challenge=null;game.intensity='suave';game.animation=false;game.code=IS_DEMO?FIXED_CODE.slice():generateCode();if(!IS_DEMO){game.memPos=shuffle([0,1,2,3,4,5,6,7,8]).slice(0,3).sort((a,b)=>a-b);game.memOrder=shuffle([0,1,2]);}startChallenge()}
function shuffle(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function generateCode(){let code=[];for(let i=0;i<4;i++){let value=Math.floor(Math.random()*GLYPHS.length);while(code.includes(value))value=Math.floor(Math.random()*GLYPHS.length);code.push(value)}return code}
function startChallenge(){game.stageStart=Date.now();game.phase='intro';game.tries=0;game.clueUsed=0;game.entry=[];if(game.done===0){screen('codeIntro');return}if(IS_DEMO){screen('demoEnd');return}startFullChallenge()}
function completeChallenge(){game.done++;game.solved++;game.phase='';buzz([60,40,70]);tone('good');confetti();screen(IS_DEMO?'demoEnd':game.done>=7?'final':'unlock')}
function home(){shell(`<div class="hero"><div class="smallcap">JUEGO COOPERATIVO PARA PAREJAS</div><h1 class="display">CÓM<span class="em">PLICES.</span></h1><p class="lead">La noche de los siete secretos.</p>${HOME}<div class="vault-caption"><span class="separator-diamond">✧</span> LA BÓVEDA SOLO SE ABRE ENTRE DOS <span class="separator-diamond">✧</span></div><div class="panel"><div class="smallcap">${IS_DEMO?'UNA CERRADURA GRATIS':'SIETE DESAFÍOS, UNA AVENTURA'}</div><p class="bodycopy" style="margin-bottom:0">Una prueba de memoria, una mano que ayuda, una risa inesperada. Aquí nadie gana solo. ${IS_DEMO?'Probá la primera cerradura y descubrí cómo empieza la aventura.':'Siete desafíos distintos para que colaboren, se diviertan y abran juntos el secreto final.'}</p></div>${button('Abrir la bóveda →','screen(\'setup\')')}<p class="center tiny">Sin instalar nada · Sin registro · Pensado para jugar juntos</p></div>`)}
function setup(){shell(`<div class="smallcap" style="margin-top:32px">ANTES DE ENTRAR</div><h2 class="display">¿Quiénes van a<br><span class="em">ser cómplices?</span></h2><p class="lead">Un solo celular. Dos personas sentadas cerca. Las pistas son individuales; la victoria es compartida.</p><div class="panel"><label class="label" for="n1">Primera persona</label><input id="n1" class="field" autocomplete="off" maxlength="22" placeholder="Tu nombre" value="${safe(game.names[0])}"><label class="label" for="n2">Segunda persona</label><input id="n2" class="field" autocomplete="off" maxlength="22" placeholder="Su nombre" value="${safe(game.names[1])}"><div class="instructions"><b>Cómo jugar:</b> una persona lee la pista a solas y la explica sin enseñar la pantalla. Después pasa el celular. Algunas pruebas necesitan dos dedos a la vez.</div>${button('Empezar juntos ✦','start()')}</div>${button('← Volver al inicio',"screen('home')",'tertiary')}`)}
function codeIntro(){shell(stageHead('DESAFÍO UNO · COMUNICACIÓN','El código<br><span class="em">que no ves</span>','Uno mira. El otro escucha. Los dos abren la primera cerradura.')+`<div class="panel"><div class="visual-icon">✦</div><h3 class="stage-card-title center">${safe(game.names[0])}, mirá los símbolos</h3><p class="bodycopy center">Vas a ver un código secreto durante <strong>8 segundos</strong>. Memorizalo y explicáselo a ${safe(game.names[1])}, sin mostrarle el teléfono. Esa persona deberá reconstruirlo.</p><div class="instructions"><b>Regla:</b> no alcanza con señalar. Describí los cuatro símbolos y su orden.</div>${button('Mostrar el código (8 s)','showCode()')}</div>`)}
function showCode(){game.phase='memorize';screen('codeShow');let rem=8;const deadline=Date.now()+8000;game.timer=setInterval(()=>{rem=Math.max(0,Math.ceil((deadline-Date.now())/1000));if($('count'))$('count').textContent=rem;if(rem<=0)screen('codePass')},130)}
function codeShow(){shell(`<div class="smallcap" style="margin-top:35px">SOLO PARA ${safe(game.names[0]).toUpperCase()}</div><h2 class="display">Memorizá<br><span class="em">la secuencia.</span></h2><div class="panel"><div class="countdown" id="count">8</div><p class="center tiny">segundos para recordar</p><div class="symbol-show" aria-label="Código de cuatro símbolos">${game.code.map(i=>`<span>${GLYPHS[i]}</span>`).join('')}</div><p class="center bodycopy">No muestres la pantalla a ${safe(game.names[1])}.</p></div>${button('Ya lo memoricé · Ocultar',"screen('codePass')",'secondary')}`)}
function codePass(){shell(`<div class="cover-center"><div class="seal">◈</div><div class="smallcap">CÓDIGO OCULTO</div><h2 class="display">Ahora es el turno<br><span class="em">de ${safe(game.names[1])}.</span></h2><p class="lead center">Pasale el celular. ${safe(game.names[0])} puede describir el código en voz alta, pero no mostrarlo.</p></div>${button('Ya tengo el celular →',"screen('codeInput')")}<p class="note center tiny">Cuatro símbolos, en el orden correcto.</p>`)}
function codeInput(){shell(stageHead('DESAFÍO UNO · DESCIFRAR','¿Qué símbolos<br><span class="em">viste?</span>',`${safe(game.names[1])}, escuchá las pistas de ${safe(game.names[0])} y armá la combinación.`)+`<div class="panel"><div class="smallcap center">COMBINACIÓN SECRETA</div><div class="answer-slots" id="slots">${Array.from({length:4},(_,i)=>`<div class="slot">${game.entry[i]===undefined?'·':GLYPHS[game.entry[i]]}</div>`).join('')}</div><div class="symbol-btns">${GLYPHS.map((g,i)=>`<button class="symbol-btn" aria-label="Símbolo ${g}" data-symbol="${i}" onclick="addGlyph(${i})">${g}</button>`).join('')}</div><div class="btnrow">${button('← Borrar','removeGlyph()','secondary')}${button('Abrir cerradura','checkCode()')}</div><div id="code-feedback" aria-live="polite"></div></div>`)}
function updateSlots(){const el=$('slots');if(el)el.innerHTML=Array.from({length:4},(_,i)=>`<div class="slot">${game.entry[i]===undefined?'·':GLYPHS[game.entry[i]]}</div>`).join('')}
function addGlyph(i){if(game.entry.length>=4)return;game.entry.push(i);buzz(15);tone('tap');updateSlots();let msg=$('code-feedback');if(msg)msg.textContent=''}
function removeGlyph(){game.entry.pop();updateSlots()}
function checkCode(){if(game.entry.length!==4){toast('Completá los cuatro símbolos.');return}if(game.entry.every((v,i)=>v===game.code[i])){completeChallenge();return}game.tries++;game.entry=[];updateSlots();const msg=$('code-feedback');if(msg)msg.innerHTML=`<div class="feedback fail">Todavía no coincide. ${safe(game.names[0])} puede explicar otra vez el orden. ¡Prueben juntos!</div>`;buzz(65);tone('bad')}
function unlock(){let title=TITLES[game.done-1];shell(`<div class="center" style="padding-top:25px"><div class="smallcap">CERRADURA ${game.done} ABIERTA</div><div class="seal" style="margin:25px auto">✓</div><h2 class="display">¡Lo hicieron<br><span class="em">juntos!</span></h2><p class="lead">${safe(title)} ya es parte de su historia. Todavía quedan ${7-game.done} secretos.</p></div>${marks()}${HOME}<div class="sp12"></div>${button('Ir a la siguiente cerradura →','startChallenge()')}`)}
function demoEnd(){shell(`<div class="center" style="padding-top:26px"><span class="ribbon">PRIMER SECRETO DESCUBIERTO</span><div class="seal" style="margin:22px auto">✦</div><h2 class="display">Una cerradura.<br><span class="em">Seis secretos más.</span></h2><p class="lead">${safe(game.names[0])} y ${safe(game.names[1])}: consiguieron abrir la primera cerradura hablando y escuchándose. Así empieza CÓMPLICES.</p></div>${marks()}<div class="panel"><div class="smallcap">ESTO ES SOLO EL COMIENZO</div><p class="bodycopy">En la edición completa les esperan otros seis desafíos distintos: coordinación con dos dedos, misiones secretas, acertijos, memoria, picardía y una bóveda final.</p><div class="demo-locks">${TITLES.slice(1).map((s,i)=>`<div class="demo-lock"><span>♙</span><strong>${safe(s)}</strong><em>RESERVADO</em></div>`).join('')}</div></div>${button('♥ Quiero el juego completo',"buyFull()") }<div class="sp12"></div>${button('Repetir esta misma prueba',"screen('setup')",'secondary')}<p class="cta-blurb">Esta demo siempre utiliza el mismo desafío y el mismo código. El juego completo estará disponible para comprar en TeHiceEsto.</p>`)}
function buyFull(){const body=encodeURIComponent('¡Hola! Quiero comprar CÓMPLICES, el juego completo de los siete desafíos para parejas. ¿Cómo lo consigo?');window.open('https://wa.me/5492215653163?text='+body,'_blank','noopener,noreferrer')}
function render(){resetTimers();switch(game.screen){case'home':home();break;case'setup':setup();break;case'codeIntro':codeIntro();break;case'codeShow':codeShow();break;case'codePass':codePass();break;case'codeInput':codeInput();break;case'unlock':unlock();break;case'demoEnd':demoEnd();break;default:renderFull();}}

function renderFull(){home()}
window.addEventListener('pagehide',resetTimers);
render();</script></body></html>

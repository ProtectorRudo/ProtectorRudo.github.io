max-width:430px}.hero ol{line-height:2.4;margin:32px 0;padding-left:20px;color:#c7e3d9}.auth-right{display:grid;place-items:center;padding:30px}.auth-card{max-width:440px;width:100%}.auth-card h2{font-size:32px;margin:10px 0}.auth-options{display:flex;justify-content:space-between;margin-top:20px}.workspace{min-height:100dvh;display:grid;grid-template-columns:250px minmax(0,1fr)}aside{background:#101f28;border-right:1px solid var(--line);padding:25px 17px;display:flex;flex-direction:column;gap:27px}nav{display:grid;gap:8px}nav button{background:none;color:#a4bcbf;border:1px solid transparent;border-radius:10px;text-align:left;padding:13px 15px;font-weight:700}nav button.active{background:#1d4939;color:var(--green);border-color:#377359}.store{background:#1c3440;border-radius:11px;border:1px solid #38525e;padding:15px;font-weight:700}.store small{display:block;color:var(--sub);font-weight:400;font-size:11px}.sidebottom{margin-top:auto}.sidebottom .notice{background:#173c30;border-color:#38775a;color:#aff1ce}.content{min-width:0;background:radial-gradient(circle at 93% 0%,#173e34,transparent 30%),#0c1922}.topbar{border-bottom:1px solid var(--line);padding:20px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px}.body{padding:clamp(20px,4vw,60px);max-width:1250px;margin:auto}.tag{display:inline-block;border-radius:22px;border:1px solid #407557;color:#aeefd1;font-size:10px;padding:7px 12px;font-weight:850;letter-spacing:1px}.banner{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#173c30;border:1px solid #377252;border-radius:14px;padding:20px;margin:22px 0}.banner p{font-size:12px;color:#b8e1c8;margin:3px 0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:19px}.stat span{color:var(--sub);font-size:12px}.stat strong{display:block;font-size:34px;margin:7px 0}.stat small{color:#86a5a8;font-size:11px}.card{margin:20px 0;background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line)}.pad{padding:24px}.empty{text-align:center;padding:65px 24px}.empty strong{display:block;font-size:16px}.empty p{max-width:480px;margin:10px auto;font-size:13px}.row{padding:19px 21px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row b{font-size:13px}.row small{display:block;color:var(--sub);font-size:11px}.state{border-radius:25px;background:#293c43;font-size:11px;padding:7px 10px;white-space:nowrap}.state.candidate{background:#1c4e3b;color:#a1efd1}.state.review,.state.waiting{color:#f6d59a;background:#4a3d29}.state.blocked,.state.superseded{color:#ffbcb5;background:#513033}.picks{display:flex;gap:8px;flex-wrap:wrap}.picks button{background:#203841;border:1px solid #44616b;padding:15px 18px;border-radius:11px;color:#dae9e5;font-weight:800}.picks button.sel{border-color:var(--green);background:#20523e;color:var(--green)}.opts{display:grid;gap:10px}.opts label{display:flex;gap:11px;align-items:center;padding:12px;border:1px solid #3a555f;border-radius:11px;cursor:pointer}.opts label:has(input:checked){border-color:var(--green);background:#183d34}.opts input{accent-color:var(--green)}.opts small{display:block;font-size:11px;color:var(--sub)}.quote-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.quote-actions button{background:#22463b;border:1px solid #417963;border-radius:8px;color:#d3f7e4;padding:7px 10px;font-size:11px}.quote-actions button:last-child{background:#4a3233;border-color:#865a5d;color:#ffe0d9}

</style></head><body><div id="app">Cargando CIERRE…</div>
<script>
(()=>{"use strict";
const API="https://bwsgxpttnrctklrcjmjs.supabase.co",KEY="sb_publishable_2wOSRn_o7M6OqRSikERXUg_2RGQWkFW",STORE="cierre_pages_session_v1",DEFAULT="Hola, ¿cómo estás? Te escribimos por el presupuesto que te enviamos. ¿Pudiste revisarlo? Si necesitás algo, estamos para ayudarte.";
const S={session:null,user:null,business:null,settings:null,connection:null,quotes:[],page:"overview",mode:"login",notice:"",busy:false,hours:36,scope:"all",message:DEFAULT};
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=()=>document.getElementById("app");
function save(){if(S.session)sessionStorage.setItem(STORE,JSON.stringify(S.session));else sessionStorage.removeItem(STORE);}
async function call(path,method="GET",payload,token,headers={}){
 const h={"apikey":KEY,"Content-Type":"application/json",...headers};if(token)h.Authorization="Bearer "+token;
 const r=await fetch(API+path,{method,headers:h,body:payload===undefined?undefined:JSON.stringify(payload),cache:"no-store"});
 const value=await r.json().catch(()=>({}));if(!r.ok)throw Error(value.msg||value.error_description||value.message||value.error||"Error HTTP "+r.status);
 return value;
}
async function refreshToken(){if(!S.session)return;const s=S.session;if(s.expires_at&&s.expires_at<Math.floor(Date.now()/1000)+70){S.session=await call("/auth/v1/token?grant_type=refresh_token","POST",{refresh_token:s.refresh_token});save();}}
async function load(){
 await refreshToken();const tok=S.session?.access_token;if(!tok)return;
 S.user=await call("/auth/v1/user","GET",undefined,tok);
 const businesses=await call("/rest/v1/cierre_businesses?select=id,owner_id,name,industry,created_at&owner_id=eq."+encodeURIComponent(S.user.id)+"&limit=1","GET",undefined,tok);
 S.business=businesses[0]||null;
 if(!S.business){S.settings=null;S.connection=null;S.quotes=[];return;}
 const id=encodeURIComponent(S.business.id);
 const results=await Promise.all([
 call("/rest/v1/cierre_settings?select=business_id,followup_hours,followup_text,contact_scope,shadow_only&business_id=eq."+id+"&limit=1","GET",undefined,tok),
 call("/rest/v1/cierre_connections?select=state,phone_masked,inbound_seen,seller_echo_seen,pdf_echo_seen&business_id=eq."+id+"&limit=1","GET",undefined,tok),
 call("/rest/v1/cierre_opportunities?select=id,quote_ref,quote_number,amount,currency,document_state,status,reason,sent_at&business_id=eq."+id+"&order=sent_at.desc&limit=150","GET",undefined,tok)
 ]);
 S.settings=results[0][0]||null;S.connection=results[1][0]||null;S.quotes=results[2]||[];
 S.hours=S.settings?.followup_hours||36;S.scope=S.settings?.contact_scope||"all";S.message=S.settings?.followup_text||DEFAULT;
}
const logo=()=>'<div class="brand"><em>↗</em><span>CIERRE<small>POR VIRALIO</small></span></div>';
const notice=()=>S.notice?'<div class="notice" role="status">'+esc(S.notice)+'</div>':"";
function auth(){
 return '<main class="auth"><section class="hero">'+logo()+'<div><span class="eyebrow">PRESUPUESTOS QUE NO SE OLVIDAN</span><h1>La oportunidad<br> sigue <em>viva.</em></h1><p>Un panel para configurar el seguimiento de presupuestos, sin cambiar la forma en que trabaja tu equipo.</p><ol><li>Registrá tu comercio</li><li>Elegí cuándo y a quién contactar</li><li>Conectá WhatsApp mediante Meta cuando esté habilitado</li></ol></div><p style="font-size:12px">Piloto en modo sombra · Ningún mensaje automático</p></section><section class="auth-right"><div class="auth-card"><span class="eyebrow">CUENTA DE COMERCIO</span><h2>'+(S.mode==="signup"?"Creá tu cuenta":S.mode==="reset"?"Recuperá tu acceso":"Ingresá a CIERRE")+'</h2><p>Acceso individual con correo y contraseña.</p>'+notice()+'<form id="authform"><label class="field">Correo electrónico<input type="email" name="email" required autocomplete="email" placeholder="tu@corralon.com"></label>'+(S.mode==="reset"?"":'<label class="field">Contraseña<input type="password" name="password" required minlength="8" autocomplete="'+(S.mode==="signup"?"new-password":"current-password")+'" placeholder="Al menos 8 caracteres"></label>')+'<button class="btn" style="width:100%" '+(S.busy?"disabled":"")+'>'+(S.busy?"Procesando…":S.mode==="signup"?"Crear cuenta":S.mode==="reset"?"Solicitar recuperación":"Ingresar")+'</button></form><div style="display:flex;justify-content:space-between;gap:10px;margin-top:18px"><button class="btn link" data-act="mode" data-value="'+(S.mode==="signup"?"login":"signup")+'">'+(S.mode==="signup"?"Ya tengo cuenta":"Crear cuenta")+'</button><button class="btn link" data-act="mode" data-value="'+(S.mode==="reset"?"login":"reset")+'">'+(S.mode==="reset"?"Volver":"Olvidé mi clave")+'</button></div><p style="font-size:12px;margin-top:30px">El dueño autoriza el acceso a WhatsApp por Meta; CIERRE nunca pide su contraseña.</p></div></section></main>';
}
function onboarding(){return '<div class="auth-right" style="min-height:100dvh"><section class="auth-card">'+logo()+'<div style="margin-top:55px"><span class="eyebrow">TU ESPACIO PRIVADO</span><h1>Creá tu comercio.</h1><p>Este negocio tendrá sus propias preferencias y presupuestos.</p>'+notice()+'<form id="newbusiness"><label class="field">Nombre del comercio<input name="name" required minlength="2" maxlength="100" placeholder="Corralón Central"></label><label class="field">Rubro<select name="industry"><option value="corralon">Corralón</option><option value="distribuidor">Distribuidor</option><option value="otro">Otro</option></select></label><button class="btn" style="width:100%" '+(S.busy?"disabled":"")+'>Crear mi panel</button></form><button class="btn link" data-act="logout">Cerrar sesión</button></div></section></div>';}
const qty=s=>S.quotes.filter(x=>x.status===s).length;
const statusName=s=>({candidate:"Posible seguimiento",review:"Revisión",waiting:"Esperar",blocked:"Bloqueado",superseded:"Reemplazado"})[s]||"Sin clasificar";
function quoteList(quotes){if(!quotes.length)return '<div class="empty"><div style="font-size:35px;color:var(--green)">▤</div><strong>Sin presupuestos registrados</strong><p>Los presupuestos llegarán cuando terminemos de conectar el WhatsApp Business oficial. No mostramos datos inventados.</p></div>';
return quotes.map(q=>'<div class="row"><div><b>'+esc(q.quote_number?"Presupuesto Nº "+q.quote_number:q.quote_ref)+'</b><small>'+(q.amount!==null&&q.currency?esc(q.currency)+" "+Number(q.amount).toLocaleString("es-AR")+" · ":"")+esc(q.reason)+'</small>'+(q.status==="blocked"||q.status==="superseded"?"":'<div class="quote-actions"><button data-act="close" data-id="'+esc(q.id)+'" data-value="sold">✓ Vendido</button><button data-act="close" data-id="'+esc(q.id)+'" data-value="human_followup">Ya contactado</button><button data-act="close" data-id="'+esc(q.id)+'" data-value="optout">No contactar</button></div>')+'</div><span class="state '+esc(q.status)+'">'+esc(statusName(q.status))+'</span></div>').join("")}
function overview(){return '<span class="eyebrow">RADAR COMERCIAL</span><h1>Tu negocio, bajo control.</h1><p>Una forma simple de no perder oportunidades.</p><div class="banner"><div><strong>'+(S.connection?.state==="connected"?"WhatsApp vinculado, pendiente de pruebas":"Primero conectemos WhatsApp")+'</strong><p>Por ahora CIERRE está en modo observación. Nunca envía mensajes a clientes.</p></div><button class="btn alt" data-act="page" data-value="connect">Ver conexión →</button></div><div class="stats">'+[["Presupuestos",S.quotes.length],["Posibles seguimientos",qty("candidate")],["En revisión",qty("review")+qty("waiting")],["Bloqueados",qty("blocked")+qty("superseded")]].map(([t,n])=>'<div class="stat"><span>'+t+'</span><strong>'+Number(n).toLocaleString("es-AR")+'</strong><small>Datos del comercio</small></div>').join("")+'</div><section class="card"><div class="head"><h2>Actividad reciente</h2><button class="btn link" data-act="page" data-value="quotes">Ver todos →</button></div>'+quoteList(S.quotes.slice(0,5))+'</section>';}
function quotes(){return '<span class="eyebrow">OPERACIONES</span><h1>Presupuestos.</h1><p>Exclusivos de '+esc(S.business.name)+'.</p><section class="card"><div class="head"><h2>Historial</h2><span class="tag">MODO SOMBRA</span></div>'+quoteList(S.quotes)+'</section>';}
function settings(){
 return '<span class="eyebrow">EN TRES PASOS</span><h1>Elegí cómo trabajar.</h1><p>Un solo mensaje eventual. Ningún chatbot.</p>'+notice()+'<form id="settingsform"><section class="card"><div class="pad"><span class="eyebrow">01 · CUÁNDO</span><h2 style="margin-top:8px">¿Cuánto tiempo esperamos?</h2><p>Desde la última interacción del cliente o vendedor.</p><div class="picks">'+[24,36,48,72].map(h=>'<button type="button" data-act="hours" data-value="'+h+'" class="'+(S.hours===h?"sel":"")+'">'+h+' horas</button>').join("")+'</div></div></section><section class="card"><div class="pad"><span class="eyebrow">02 · QUIÉNES</span><h2 style="margin-top:8px">¿A qué clientes?</h2><div class="opts">'+[["all","Todos","Agendados y no agendados"],["saved","Solo agendados","Guardados en WhatsApp Business"],["unsaved","Solo sin agendar","No guardados en la agenda"]].map(([k,t,d])=>'<label><input type="radio" name="scope" value="'+k+'" '+(S.scope===k?"checked":"")+'><span>'+t+'<small>'+d+'</small></span></label>').join("")+'</div>'+(S.scope!=="all"?'<div class="notice">Este filtro exige una sincronización completa y verificada de la agenda de WhatsApp.</div>':"")+'</div></section><section class="card"><div class="pad"><span class="eyebrow">03 · MENSAJE</span><h2 style="margin-top:8px">¿Qué escribiría CIERRE?</h2><p>Una plantilla aprobada por Meta será necesaria antes de cualquier envío real.</p><label class="field">Texto<textarea name="message" minlength="35" maxlength="800" rows="5" required>'+esc(S.message)+'</textarea></label></div></section><div class="banner"><strong>● Envíos automáticos desactivados</strong><button class="btn" '+(S.busy?"disabled":"")+'>Guardar cambios</button></div></form>';}
function connection(){const c=S.connection;return '<span class="eyebrow">CONEXIÓN OFICIAL</span><h1>WhatsApp Business.</h1><p>El dueño autoriza el número desde Meta. No basta con escribirlo.</p><div class="card"><div class="pad"><span class="tag">'+(c?.state==="connected"?"VINCULACIÓN REGISTRADA":"AÚN SIN CONECTAR")+'</span><h2 style="margin-top:25px">Enlace oficial, sin QR falso</h2><p>La vinculación mediante Meta Embedded Signup está en preparación. Cuando dispongamos de los permisos y el receptor esté publicado, el negocio podrá confirmar el número desde el flujo de Meta.</p><div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+[["Cliente",c?.inbound_seen],["Vendedor",c?.seller_echo_seen],["PDF",c?.pdf_echo_seen]].map(([x,ok])=>'<div class="stat"><span>'+x+'</span><strong style="font-size:15px">'+(ok?"Detectado":"Pendiente")+'</strong></div>').join("")+'</div><p style="font-size:12px">Hasta verificar todos los eventos, el sistema no puede hacer seguimientos.</p></div></div>';}
function panel(){return '<div class="workspace"><aside>'+logo()+'<div class="store">'+esc(S.business.name)+'<small>Panel privado</small></div><nav>'+[["overview","◫ Resumen"],["quotes","▤ Presupuestos"],["settings","⚙ Configuración"],["connect","◉ WhatsApp"]].map(([v,t])=>'<button data-act="page" data-value="'+v+'" class="'+(S.page===v?"active":"")+'">'+t+'</button>').join("")+'</nav><div class="sidebottom"><div class="notice">● Modo sombra activo</div><button class="btn link" data-act="logout">Cerrar sesión</button></div></aside><main class="content"><div class="topbar"><b>'+esc(S.business.name)+'</b><div><button class="btn link" data-act="refresh">↻ Actualizar</button><button class="btn link" data-act="logout">Salir</button></div></div><div class="body">'+(S.page==="overview"?overview():S.page==="quotes"?quotes():S.page==="settings"?settings():connection())+'<footer class="footer">CIERRE · Portal alternativo de prueba · Los envíos automáticos siguen desactivados.</footer></div></main></div>';}
function render(){document.getElementById("app").innerHTML=!S.session?auth():!S.business?onboarding():panel();}
async function transaction(fn){if(S.busy)return;S.busy=true;S.notice="";try{await fn()}catch(e){S.notice=e?.message||"No se pudo completar la operación"}finally{S.busy=false;render()}}
document.addEventListener("click",event=>{
 const btn=event.target.closest("button[data-act]");if(!btn)return;
 const action=btn.dataset.act,value=btn.dataset.value;
 if(action==="page"){event.preventDefault();S.page=value;S.notice="";render();}
 if(action==="mode"){S.mode=value;S.notice="";render();}
 if(action==="hours"){const draft=document.querySelector('textarea[name="message"]');if(draft)S.message=draft.value;S.hours=Number(value);render();}
 if(action==="logout"){const old=S.session;S.session=null;S.user=null;S.business=null;S.quotes=[];save();S.mode="login";S.notice="";render();if(old?.access_token)call("/auth/v1/logout","POST",{},old.access_token).catch(()=>{});}
 if(action==="refresh")transaction(async()=>{await load();S.notice="Información actualizada."});
 if(action==="close"){
   const quoteId=btn.dataset.id,kind=value;
   if(!/^[0-9a-f-]{36}$/i.test(quoteId)||!["sold","human_followup","optout"].includes(kind))return;
   if(!confirm(kind==="sold"?"¿Confirmás que se concretó esta venta?":kind==="human_followup"?"¿Confirmás que el vendedor ya contactó al cliente?":"¿Confirmás que este cliente no debe recibir mensajes?"))return;
   transaction(async()=>{
     await refreshToken();
     await call("/rest/v1/rpc/cierre_block_quote","POST",{p_quote_id:quoteId,p_action:kind},S.session.access_token);
     await load();S.page="quotes";S.notice="Bloqueo guardado. No se enviará ningún WhatsApp.";
   });
 }
});
document.addEventListener("change",event=>{
 if(event.target.matches('input[name="scope"]')){const draft=document.querySelector('textarea[name="message"]');if(draft)S.message=draft.value;S.scope=event.target.value;render();}
});
document.addEventListener("submit",event=>{
 const id=event.target.id;if(!["authform","newbusiness","settingsform"].includes(id))return;
 event.preventDefault();
 const data=new FormData(event.target);
 transaction(async()=>{
  if(id==="authform"){
   const email=String(data.get("email")||"").trim().toLowerCase(),password=String(data.get("password")||"");
   if(S.mode==="reset"){
    await call("/auth/v1/recover","POST",{email});
    S.notice="Si el correo está registrado, te llegará un enlace de recuperación.";return;
   }
   if(password.length<8)throw Error("La contraseña necesita al menos ocho caracteres.");
   if(S.mode==="signup"){
    const result=await call("/auth/v1/signup","POST",{email,password});
    if(!result.access_token){S.mode="login";S.notice="Revisá tu correo para confirmar la cuenta. Después ingresá aquí.";return;}
    S.session=result;save();await load();S.notice="Cuenta creada.";return;
   }
   S.session=await call("/auth/v1/token?grant_type=password","POST",{email,password});
   save();await load();S.notice="";
  }else if(id==="newbusiness"){
   await refreshToken();const name=String(data.get("name")||"").trim(),industry=String(data.get("industry")||"corralon");
   if(name.length<2||name.length>100)throw Error("Nombre inválido");
   await call("/rest/v1/cierre_businesses","POST",{owner_id:S.user.id,name,industry},S.session.access_token,{"Prefer":"return=minimal"});
   await load();S.page="overview";S.notice="Comercio creado.";
  }else{
   await refreshToken();const message=String(data.get("message")||"").trim();
   if(message.length<35||message.length>800)throw Error("El texto debe tener entre 35 y 800 caracteres.");
   await call("/rest/v1/cierre_settings?on_conflict=business_id","POST",
     {business_id:S.business.id,followup_hours:S.hours,contact_scope:S.scope,followup_text:message,ai_enabled:true,shadow_only:true},
     S.session.access_token,{"Prefer":"resolution=merge-duplicates,return=minimal"});
   await load();S.page="settings";S.notice="Configuración guardada. Ningún mensaje se envió.";
  }
 });
});
(async()=>{
 try{
  const raw=sessionStorage.getItem(STORE);
  if(raw){S.session=JSON.parse(raw);await load();}
 }catch(e){S.session=null;save();S.notice="La sesión anterior ya no es válida. Ingresá nuevamente.";}

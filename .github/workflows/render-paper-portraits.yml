name: Render true Styloo 3D character portraits
on:
  push:
    branches: [main]
    paths: ['.github/workflows/render-paper-portraits.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-avatars:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund --no-save playwright@1.56.1
      - run: |
          command -v google-chrome && echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV" || true
          command -v chromium && echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV" || true
      - name: Render portrait PNGs directly from original local Styloo GLBs using Three.js
        run: node .github/scripts/render-paper-portraits.cjs
      - name: Commit all four generated genuine 3D portrait files
        run: |
          set -euo pipefail
          git config user.name 'modo-caos-asset-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Modo-caos/assets/styloo/portraits/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets(paper): render four real Styloo 3D hero portraits'
            git push origin HEAD:main
          fi

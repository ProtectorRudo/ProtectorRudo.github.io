name: Sticker Bomb Amistad - auditoria movil de 12 escenas
on:
  push:
    branches: [main]
    paths:
      - "tehiceesto/experiencias/sticker-bomb-amistad/**"
      - ".github/workflows/sticker-bomb-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser for end-to-end quality control
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate sticker experience and responsive layouts
        run: node tehiceesto/experiencias/sticker-bomb-amistad/qa.mjs
        env:
          MODEL_URL: https://tehiceesto.com/experiencias/sticker-bomb-amistad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sticker-bomb-amistad-preview
          path: /tmp/sticker-bomb-preview/*.png
          retention-days: 7
          if-no-files-found: ignore

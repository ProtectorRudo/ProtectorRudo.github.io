name: Auditar TODAVÍA en navegadores reales
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditar-todavia.yml'
      - '.github/scripts/todavia-e2e.cjs'
      - 'todavia/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Recorrer las cinco escenas y auditar Android y escritorio
        run: node .github/scripts/todavia-e2e.cjs

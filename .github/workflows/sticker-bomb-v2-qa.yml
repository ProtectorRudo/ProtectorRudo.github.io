name: Sticker Bomb v2 - visual regression and full journey
on:
  push:
    branches: [main]
    paths:
      - "tehiceesto/experiencias/sticker-bomb-amistad/v2/**"
      - "tehiceesto/experiencias/sticker-bomb-amistad/qa.mjs"
      - "tehiceesto/experiencias/sticker-bomb-amistad/qa-v2.mjs"
      - ".github/workflows/sticker-bomb-v2-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test all 12 scenes with newly designed stickers
        run: node tehiceesto/experiencias/sticker-bomb-amistad/qa.mjs
        env:
          MODEL_URL: https://protectorrudo.github.io/tehiceesto/experiencias/sticker-bomb-amistad/v2/
      - name: Verify twelve sticker visuals loaded, responsive, no layout shifts
        run: node tehiceesto/experiencias/sticker-bomb-amistad/qa-v2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sticker-bomb-v2-mobile-review
          path: /tmp/sticker-bomb-preview/*.png
          retention-days: 7
          if-no-files-found: ignore

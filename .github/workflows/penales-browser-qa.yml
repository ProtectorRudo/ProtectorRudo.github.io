name: PENALES AR — real mobile browser QA
on:
  push:
    branches: [main]
    paths:
      - 'Modo-caos/penales*'
      - 'scripts/penales-browser-qa.mjs'
      - '.github/workflows/penales-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch site and run swipe smoke
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/penales-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/penales-browser-qa.mjs
      - name: Capture screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: penales-ar-browser-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

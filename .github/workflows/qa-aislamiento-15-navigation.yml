name: Aislamiento 15 - Stalker nav and collisions
# Regression gate for physical obstacles, gas station and door transitions, Oct 14 2026.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-aislamiento-15-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ProtectorRudo/viralio
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install exact dependency versions
        working-directory: source
        run: npm ci --no-audit --no-fund
      - name: Verify F-08 clearance regression
        working-directory: source
        run: npx vitest run tests/aislamiento15-fixtures.test.ts
      - name: Compile actual collision and nav source
        run: |
          cd source
          npx --yes esbuild@0.25.10 src/app/aislamiento-15/ChamberNavigation.ts \
            --bundle --format=esm --platform=node --target=es2022 --outfile=/tmp/isolation-navigation.mjs
      - name: Assert collision boundaries and A-star route through medical furniture
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {Vector3} from './source/node_modules/three/build/three.module.js';
          const {canStand,slide,findPath,clearSight}=await import('file:///tmp/isolation-navigation.mjs');
          const vec=(x,z)=>new Vector3(x,0,z);
          assert.equal(canStand(0,2.85,2,.3),false,'Urgencias bed must be solid');
          assert.equal(canStand(0,0,1,.3),true,'Main hallway must be clear');
          assert.equal(canStand(1,4.04,-12.8,.3),false,'Isolation pod must be solid');
          assert.equal(canStand(2,0,-29.2,.3),false,'Containment console must be solid');
          assert.equal(canStand(0,0,-6.37,.3),true,'Doorway must be reachable');
          assert.equal(canStand(0,2.5,-6.37,.3),false,'Wall beside door must block player');
          const tests=[
            [1,vec(-1.5,-17.3),vec(-3.6,-8.3)],
            [2,vec(0,-22.7),vec(-3.8,-30.95)],
            [0,vec(0,3),vec(-2.3,-4)]
          ];
          for(const [room,from,to] of tests){
            assert(canStand(room,from.x,from.z,.39),'Starting point blocked');
            assert(canStand(room,to.x,to.z,.39),'Destination point blocked');
            const path=findPath(room,from,to);
            assert(path.length>0 && path.length<80,'A* invalid waypoint count');
            for(const point of path) {
              assert(canStand(room,point.x,point.z,.37),'Path enters physical equipment');
            }
            let at={...from};
            for(let ticks=0;ticks<3000;ticks++) {
              const goal=path[0]??to;
              const dx=goal.x-at.x,dz=goal.z-at.z;
              const len=Math.hypot(dx,dz);
              if(len<.15){path.shift();if(path.length===0)break;continue;}
              slide(room,at,dx/len*.085,dz/len*.085,.35);
              assert(canStand(room,at.x,at.z,.33),'Stalker clipped through medical equipment');
            }
            assert(Math.hypot(at.x-to.x,at.z-to.z)<1.2,'Stalker unable to route to target');
          }
          console.log('PASS: rigid hospital furniture, clear main aisles, door transition and obstacle-aware stalker navigation');
          JS

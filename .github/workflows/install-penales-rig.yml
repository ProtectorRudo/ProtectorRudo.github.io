name: Install Quaternius CC0 soccer rig for PENALES AR
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-penales-rig.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor-cc0-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Download pinned license and binary glTF from CC0 source
        run: |
          set -euo pipefail
          mkdir -p 'Modo-caos/assets/penales'
          curl -fL --retry 3 --connect-timeout 10 --max-time 75 \
            'https://raw.githubusercontent.com/kendrekaran/striker-3d/57847f87ff3d924712a1bb37df9dae391aedc315/assets/player.glb' \
            -o 'Modo-caos/assets/penales/player.glb'
          curl -fL --retry 3 --connect-timeout 10 --max-time 40 \
            'https://raw.githubusercontent.com/kendrekaran/striker-3d/57847f87ff3d924712a1bb37df9dae391aedc315/assets/LICENSE-quaternius.txt' \
            -o 'Modo-caos/assets/penales/LICENSE-quaternius.txt'
      - name: Audit rig, animation, rights and provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,struct,hashlib
          root=Path('Modo-caos/assets/penales')
          data=(root/'player.glb').read_bytes()
          assert len(data)==498212, f'Unexpected GLB size {len(data)}'
          magic,version,total=struct.unpack_from('<III',data)
          assert magic==0x46546c67 and version==2 and total==len(data), 'Invalid glTF 2.0 binary'
          length,ctype=struct.unpack_from('<II',data,12)
          assert ctype==0x4e4f534a and 20+length<=len(data), 'Missing glTF JSON'
          doc=json.loads(data[20:20+length])
          assert doc.get('skins') and doc.get('animations') and doc.get('meshes'), 'Rig must contain skinned animated geometry'
          assert len(doc.get('animations',[]))>=3, 'Expected playable animation clips'
          lic=(root/'LICENSE-quaternius.txt').read_text()
          assert 'CC0 1.0' in lic and 'Quaternius' in lic
          meta={'asset':'Animated Men, Quaternius','license':'CC0 1.0 Universal','origin':'https://github.com/kendrekaran/striker-3d','commit':'57847f87ff3d924712a1bb37df9dae391aedc315','bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'animations':[x.get('name') for x in doc['animations']],'skins':len(doc['skins']),'meshes':len(doc['meshes']),'materials':[m.get('name') for m in doc.get('materials',[])]}
          (root/'manifest.json').write_text(json.dumps(meta,indent=2))
          print('PENALES_CC0_MODEL_AUDITED',json.dumps(meta))
          PY
      - name: Commit audited GLB and license without modifying any other game
        run: |
          set -euo pipefail
          git config user.name 'modo-caos-asset-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- 'Modo-caos/assets/penales/'
          if git diff --cached --quiet; then
            echo 'Asset already installed and verified'
          else
            git commit -m 'assets(penales): vendor audited animated Quaternius CC0 GLB + provenance'
            git push origin HEAD:main
          fi

name: Aislamiento 15 - full 3-room gameplay QA
# Changed gameplay: clear-critical-hospital-signs-20261015
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-aislamiento-15-route.yml'
permissions:
  contents: read
jobs:
  full-escape:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ProtectorRudo/viralio
          path: source
      - uses: actions/checkout@v4
        with:
          path: website
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install exact dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund
      - name: Validate TypeScript
        working-directory: source
        run: npm run typecheck
      - name: Install Chromium
        working-directory: source
        run: npx playwright install --with-deps chromium
      - name: Compile private test-only instrumented game
        run: |
          mkdir -p isolation-qa-site/aislamiento-15/models
          cp website/aislamiento-15/models/*.glb isolation-qa-site/aislamiento-15/models/
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const name='source/src/app/aislamiento-15/IsolationGame.tsx';
          const original=await readFile(name,'utf8');
          const anchor='    worldRef.current = world;';
          if(!original.includes(anchor))throw Error('Runtime test injection target changed');
          const instrumented='import { canStand } from "./ChamberNavigation";\n'+
            original.replace(anchor,anchor+'\n    (window as any).__isoWorld = world;\n    (window as any).__isoAct = interactWith;\n    (window as any).__isoCanStand = canStand;');
          await writeFile('source/src/app/aislamiento-15/IsolationGame.qa.tsx',instrumented);
          await writeFile('source/isolation-qa-entry.tsx',[
            'import React from "react";',
            'import { createRoot } from "react-dom/client";',
            'import IsolationGame from "./src/app/aislamiento-15/IsolationGame.qa";',
            'createRoot(document.getElementById("root")!).render(<IsolationGame />);'
          ].join('\n'));
          NODE
          cd source
          npx --yes esbuild@0.25.10 isolation-qa-entry.tsx --bundle --format=esm --target=es2022 --minify --outdir=../isolation-qa-site/aislamiento-15
          cat > ../isolation-qa-site/aislamiento-15/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="es"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
          <title>Aislamiento test, not production</title><link rel="stylesheet" href="./isolation-qa-entry.css">
          <script type="module" src="./isolation-qa-entry.js"></script></head><body style="margin:0"><div id="root"></div></body></html>
          HTML
      - name: Solve actual UI gameplay through all chambers
        run: |
          python3 -m http.server 8878 --directory isolation-qa-site >/tmp/isolation-qa-http.log 2>&1 &
          cat > source/isolation-run-through.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          let page;
          try {
            page=await browser.newPage({viewport:{width:1100,height:760}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            await page.goto('http://127.0.0.1:8878/aislamiento-15/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(() => !!window.__isoWorld && !!window.__isoAct,{timeout:30000});
            await page.getByRole('button',{name:/COMENZAR AISLAMIENTO/}).click();
            await page.locator('.iso-hint-button').click();
            await page.getByText('PISTA 1 DE 3 PARA ESTE OBJETIVO').waitFor();
            const firstHint=await page.locator('.iso-panel > p').first().innerText();
            assert(!firstHint.includes('mostrador'),'First hint should not reveal object location');
            await page.getByRole('button',{name:/REVELAR UNA PISTA MÁS CLARA/}).click();
            await page.getByText('PISTA 2 DE 3 PARA ESTE OBJETIVO').waitFor();
            await page.getByRole('button',{name:/REVELAR UNA PISTA MÁS CLARA/}).click();
            await page.getByText('PISTA 3 DE 3 PARA ESTE OBJETIVO').waitFor();
            await page.getByRole('button',{name:/VOLVER A LA SALA/}).click();
            console.log('PASS: graded 3-level help does not spoil puzzles on first request');
            async function invoke(...ids) {return page.evaluate(ids=>{for(const id of ids)window.__isoAct(id);},ids);}
            const backgroundSafety=await page.evaluate(()=>{
              const w=window.__isoWorld;
              Object.defineProperty(document,'hidden',{configurable:true,value:true});
              document.dispatchEvent(new Event('visibilitychange'));
              const paused=w.running===false;
              Object.defineProperty(document,'hidden',{configurable:true,value:false});
              document.dispatchEvent(new Event('visibilitychange'));
              delete document.hidden;
              return {paused,resumed:w.running===true};
            });
            assert.deepEqual(backgroundSafety,{paused:true,resumed:true},
              'Mobile app interruption must suspend and resume the scene');
            console.log('PASS: mobile background interruption freezes pursuer and resumes gameplay');
            const sign=await page.evaluate(()=>window.__isoWorld.getSignText('sign-0'));
            assert(sign && sign.length>0,'Physical hospital signs have accessible text');
            await invoke('sign-0');
            await page.locator('.iso-sign-transcription p').first().waitFor();
            assert.equal(await page.locator('.iso-sign-transcription p').first().textContent(),sign[0]);
            await page.getByRole('button',{name:/VOLVER AL HOSPITAL/}).click();
            await page.keyboard.press('h');
            await page.getByRole('button',{name:/MEDIR FPS EN MI DISPOSITIVO/}).click();
            await page.locator('.iso-device-performance').waitFor();
            await page.waitForTimeout(1900);
            const diagnostic=await page.locator('.iso-device-performance').innerText();
            assert(diagnostic.includes('Draw calls')&&diagnostic.includes('FPS'),'In-device WebGL diagnostics missing');
            await page.getByRole('button',{name:/Cerrar diagnóstico de rendimiento/}).click();
            console.log('PASS: diegetic sign inspection and performance diagnostic HUD');
            async function snapshot(){return page.evaluate(()=>{const w=window.__isoWorld; return {
              room:w.room,hasFuse:w.hasFuse,fusePlaced:w.fusePlaced,hasBadge:w.hasBadge,readTriage:w.readTriage,
              relays:[...w.relays],firstDoor:w.firstDoor,oxygenCells:[...w.oxygenCells],oxygenInstalled:w.oxygenInstalled,
              valves:[...w.valves],secondDoor:w.secondDoor,foundLog:w.foundLog,breakers:[...w.breakers],won:w.won
            };});}
            const inspection=await page.evaluate(()=>{
              const w=window.__isoWorld,stand=window.__isoCanStand;
              const initial=w.player.clone(),initialRoom=w.room;
              const failures=[],success=[];
              w.scene.updateMatrixWorld(true);
              for(const t of w.targets.filter(t => !t.id.startsWith('sign-') ||
                (w.signage.get(t.id) ?? []).some(line =>
                  line.includes('SECUENCIA DE PURGA') || line.includes('APERTURA DE EMERGENCIA')))){
                w.room=t.room;
                w.showRoom();
                const point=t.object.getWorldPosition(w.player.clone());
                let reach=false;
                for(const radius of [1.0,1.45,2.0,2.5]){
                  if(reach)break;
                  for(let n=0;n<24;n++){
                    const angle=n*Math.PI/12;
                    const cx=point.x+Math.cos(angle)*radius;
                    const cz=point.z+Math.sin(angle)*radius;
                    if(!stand(t.room,cx,cz,.3))continue;
                    const origin=w.player.clone().set(cx,1.64,cz);
                    w.camera.position.copy(origin);
                    w.camera.lookAt(point);
                    w.camera.updateMatrixWorld(true);
                    if(w.hitAt(0,0)?.id===t.id){reach=true;break;}
                  }
                }
                if(reach)success.push(t.id);
                else failures.push({id:t.id,room:t.room,position:[point.x,point.z]});
              }
              w.room=initialRoom;
              w.showRoom();
              w.player.copy(initial);
              w.camera.position.copy(initial);
              w.camera.rotation.set(w.pitch,w.yaw,0,'YXZ');
              return {success,failures};
            });
            console.log('ACCESSIBILITY_AUDIT='+JSON.stringify(inspection));
            assert.deepEqual(inspection.failures,[],'Unreachable/non-raycastable 3D puzzle target');
            await invoke('fuse','fusebox','badge','triage');
            await page.waitForFunction(()=>window.__isoWorld.inspecting===true);
            await page.getByRole('button',{name:/MEMORIZAR PRIORIDADES/}).click();
            await page.waitForFunction(()=>window.__isoWorld.inspecting===false);
            const pattern=await page.evaluate(()=>({
              relays:[...window.__isoWorld.relayPattern],
              valves:[...window.__isoWorld.valvePattern],
              digits:[...window.__isoWorld.triageDigits]
            }));
            const wrongRelay=[0,1,2].find(n=>n!==pattern.relays[0]);
            await invoke('relay-'+wrongRelay);
            assert.equal((await snapshot()).relays.length,0,'Wrong relay should reset sequence');
            await invoke(...pattern.relays.map(n=>'relay-'+n));
            assert.deepEqual((await snapshot()).relays,pattern.relays);
            await invoke('terminal');
            for(const number of pattern.digits) {
              await page.getByRole('button',{name:String(number),exact:true}).click();
            }
            await page.getByRole('button',{name:'CONFIRMAR'}).click();
            assert.equal((await snapshot()).firstDoor,true);
            await page.evaluate(()=>{
              const w=window.__isoWorld;w.player.set(0,1.64,-6.28);w.keys.add('KeyW');
              w.tick(.05,150,.2);w.keys.delete('KeyW');
            });
            await page.getByText('AISLAMIENTO',{exact:true}).first().waitFor();
            assert.equal((await snapshot()).room,1,'Transition to isolation');
            await invoke('cell-alpha','cell-beta','regulator');
            assert.equal((await snapshot()).oxygenInstalled,true);
            await invoke(...pattern.valves.map(c=>'valve-'+c),'extractor');
            assert.equal((await snapshot()).secondDoor,true);
            await page.evaluate(()=>{
              const w=window.__isoWorld;w.player.set(0,1.64,-19.28);w.keys.add('KeyW');
              w.tick(.05,430,.48);w.keys.delete('KeyW');
            });
            assert.equal((await snapshot()).room,2,'Transition to containment');
            await invoke('log');
            await page.waitForFunction(()=>window.__isoWorld.inspecting===true);
            const safeExamination=await page.evaluate(()=>{
              const w=window.__isoWorld;
              const prevAttack=w.enemyLastAttack;
              w.enemy.position.set(w.player.x,0,w.player.z+.3);
              w.nextThreatAt=0;
              w.eventAt=-1;
              w.tick(.05,600,.67);
              return {before:prevAttack,after:w.enemyLastAttack};
            });
            assert.equal(safeExamination.after,safeExamination.before,'Stalker must not attack while reading records');
            await page.getByRole('button',{name:/HE ENTENDIDO/}).click();
            await page.waitForFunction(()=>window.__isoWorld.inspecting===false);
            await invoke('breaker-0','breaker-2');
            assert.deepEqual((await snapshot()).breakers,[true,false,true]);
            await invoke('speaker');
            await page.getByRole('button',{name:/RECHAZAR COMUNICACIÓN/}).click();
            await invoke('escape');
            assert.equal((await snapshot()).won,true,'Evacuation should succeed');
            await page.getByRole('heading',{name:/ESTÁS/}).waitFor();
            assert.deepEqual(pageErrors,[],'No JavaScript runtime errors');
            console.log('PASS: full route Urgencias -> Aislamiento -> Contención -> evacuación; physical puzzles and logic verified');
          } finally {await browser.close();}
          JS
          node source/isolation-run-through.mjs

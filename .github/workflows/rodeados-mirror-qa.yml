name: RODEADOS mirror — independent GitHub Pages smoke
on:
  pull_request:
    paths:
      - 'Modo-caos/**'
      - '.github/scripts/rodeados-mirror-smoke.cjs'
      - '.github/scripts/rodeados-mirror-xr-smoke.cjs'
      - '.github/scripts/rodeados-mirror-manul-smoke.cjs'
      - '.github/scripts/rodeados-mirror-auto-robots-smoke.cjs'
      - '.github/workflows/rodeados-mirror-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check Modo-caos/rodeados-core.js
          node --check Modo-caos/rodeados-ux.js
          node --check Modo-caos/rodeados-runtime.js
          node --check Modo-caos/rodeados-manul.js
          node --check Modo-caos/rodeados-robots-auto.js
          grep -q 'rodeados-robots-auto.js' Modo-caos/rodeados-runtime.js
          grep -q 'type="importmap"' Modo-caos/rodeados.html
          ! grep -q 'id="manulFile"' Modo-caos/rodeados.html
          test -f Modo-caos/rodeados-manul.html
          grep -q 'CC BY' Modo-caos/rodeados-manul.html
          node --check Modo-caos/rodeados-ar-compositor.js
          test -f Modo-caos/rodeados-ar-compositor.js
          test -f Modo-caos/rodeados.html
          grep -q 'src="/Modo-caos/rodeados-runtime.js' Modo-caos/rodeados.html
      - run: |
          npm install --ignore-scripts --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 >/tmp/rodeados-http.log 2>&1 &
          node .github/scripts/rodeados-mirror-smoke.cjs
          node .github/scripts/rodeados-mirror-xr-smoke.cjs
          node .github/scripts/rodeados-mirror-manul-smoke.cjs
          node .github/scripts/rodeados-mirror-auto-robots-smoke.cjs

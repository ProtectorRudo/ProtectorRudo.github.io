name: Territory Loop Animal Android QA
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/paper-animal-browser-qa.cjs'
      - '.github/workflows/paper-animal-browser-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund --no-save playwright@1.56.1
      - run: |
          command -v google-chrome && echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV" || true
          command -v chromium && echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV" || true
      - run: node .github/scripts/paper-animal-browser-qa.cjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: paper-animal-android-screenshots, path: '/tmp/paper-animal-*.png', if-no-files-found: ignore}

name: Relicario AR — audit browser
on:
  push:
    branches: [main]
    paths:
      - 'tehiceesto/ar-pareja-auditoria/**'
      - '.github/workflows/relicario-audit.yml'
      - 'scripts/relicario-audit.mjs'
      - 'scripts/relicario-ar-audit.mjs'
      - 'scripts/relicario-xr-geometry-audit.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Serve standalone demo
        run: |
          python3 -m http.server 8765 --directory . > /tmp/tehiceesto-ar-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/tehiceesto/ar-pareja-auditoria/ >/dev/null && break || sleep 1; done
      - name: Inspect 3D visuals, mobile and narrative
        run: node scripts/relicario-audit.mjs
      - name: Audit mobile AR camera fallback and visible placement
        run: node scripts/relicario-ar-audit.mjs
      - name: Audit real XR pose projection and prevent invisible placement
        run: node scripts/relicario-xr-geometry-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relicario-audit-screenshots
          path: visual-smoke/relicario/
          retention-days: 7

name: BLACKZONE tactical QA
on:
  pull_request:
    paths:
      - 'la-casa-alterada/**'
      - '.github/workflows/blackzone-tactical-qa.yml'
  push:
    branches: [main]
    paths:
      - 'la-casa-alterada/**'
      - '.github/workflows/blackzone-tactical-qa.yml'

permissions:
  contents: read

jobs:
  tactical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate BLACKZONE V21 geometry and tactics
        run: node --test la-casa-alterada/tests/*.test.mjs

name: PENALES AR — two-player authenticated duel
on:
  push:
    branches: [main]
    paths:
      - 'scripts/penales-online-qa.mjs'
      - '.github/workflows/penales-online-qa.yml'
      - 'Modo-caos/penales*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  online-duel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test independent browsers
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/penales-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/penales-online-qa.mjs
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: penales-online-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

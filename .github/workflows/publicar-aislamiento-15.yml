name: Publicar Aislamiento 15 en GitHub Pages
# Revision de fuente: 028accff9c6f7c9ce4c9e6e2e6e82c7433ca5d87
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-aislamiento-15.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aislamiento15-pages-publish
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Conservar el sitio y las salas existentes
        uses: actions/checkout@v4
        with:
          path: website
          persist-credentials: true

      - name: Descargar el código original de Viralio
        uses: actions/checkout@v4
        with:
          repository: ProtectorRudo/viralio
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Instalar dependencias exactas de React y Three.js
        working-directory: source
        run: npm ci --no-audit --no-fund

      - name: Verificar tipos TypeScript del juego completo
        working-directory: source
        run: npm run typecheck

      - name: Generar la aplicación estática jugable
        run: |
          mkdir -p website/aislamiento-15
          cat > source/isolation-static-entry.tsx <<'TSX'
          import React from "react";
          import { createRoot } from "react-dom/client";
          import IsolationGame from "./src/app/aislamiento-15/IsolationGame";
          createRoot(document.getElementById("root")!).render(<IsolationGame />);
          TSX
          cd source
          npx --yes esbuild@0.25.10 isolation-static-entry.tsx --bundle --minify --format=esm --target=es2022 --outdir=../website/aislamiento-15 --log-level=info
          cp public/aislamiento-15/cover.svg ../website/aislamiento-15/cover.svg
          cat > ../website/aislamiento-15/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
              <meta name="theme-color" content="#0b1113">
              <meta name="description" content="AISLAMIENTO 15: escape room 3D de terror con 3 salas, 15 minutos para escapar y una anomalía que no quiere dejarte salir. Una creación original de Viralio.">
              <title>AISLAMIENTO 15 — Escape 3D de Viralio</title>
              <link rel="icon" type="image/svg+xml" href="./cover.svg">
              <link rel="stylesheet" href="./isolation-static-entry.css">
              <script defer type="module" src="./isolation-static-entry.js"></script>
            </head>
            <body style="margin:0;background:#0b1113">
              <div id="root"></div>
              <noscript>Esta experiencia requiere JavaScript, WebGL2 y un navegador actualizado.</noscript>
            </body>
          </html>
          HTML

      - name: Integrar modelos hospitalarios GLB CC0 y enemigo esquelético propio
        run: |
          set -euo pipefail
          mkdir -p website/aislamiento-15/models
          curl --fail --location --retry 3 --connect-timeout 12 --max-time 120 \
            'https://www.innerscene.com/api/library/hospital-bed-flat-mattress-44fc9faf/download' \
            -o website/aislamiento-15/models/hospital-bed-flat.glb
          curl --fail --location --retry 3 --connect-timeout 12 --max-time 120 \
            'https://www.innerscene.com/api/library/hospital-bed-raised-backrest-6bb95542/download' \
            -o website/aislamiento-15/models/hospital-bed-raised.glb
          curl --fail --location --retry 3 --connect-timeout 12 --max-time 120 \
            'https://www.innerscene.com/api/library/patient-room-headwall-services-unit-536f71cf/download' \
            -o website/aislamiento-15/models/medical-headwall.glb
          curl --fail --location --retry 3 --connect-timeout 12 --max-time 120 \
            'https://www.innerscene.com/api/library/three-shelf-medical-supply-cart-45cc326c/download' \
            -o website/aislamiento-15/models/supply-cart.glb
          curl --fail --location --retry 3 --connect-timeout 12 --max-time 120 \
            'https://www.innerscene.com/api/library/vital-signs-monitor-on-roll-stand-83c9b7fa/download' \
            -o website/aislamiento-15/models/vital-monitor.glb
          curl --fail --location --retry 3 --connect-timeout 12 --max-time 120 \
            'https://www.innerscene.com/api/library/mobile-examination-light-65ace7fb/download' \
            -o website/aislamiento-15/models/exam-light.glb
          curl --fail --location --retry 3 --connect-timeout 12 --max-time 120 \
            'https://www.innerscene.com/api/library/privacy-curtain-and-ceiling-track-0353bfbc/download' \
            -o website/aislamiento-15/models/privacy-curtain.glb
          curl --fail --location --retry 3 --connect-timeout 12 --max-time 120 \
            'https://www.innerscene.com/api/library/patient-transport-stretcher-3ff4d512/download' \
            -o website/aislamiento-15/models/transport-stretcher.glb
          cp website/la-ultima-funcion/models/usher/usher-mobile.glb website/aislamiento-15/models/warden.glb
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          for(const name of ['hospital-bed-flat.glb','hospital-bed-raised.glb','medical-headwall.glb','supply-cart.glb','vital-monitor.glb','exam-light.glb','privacy-curtain.glb','transport-stretcher.glb','warden.glb']) {
            const bytes=await readFile('website/aislamiento-15/models/'+name);
            if(bytes.toString('ascii',0,4)!=='glTF'||bytes.length<20000)throw Error('GLB corrupto: '+name);
            if(bytes.length>12000000)throw Error('GLB demasiado pesado: '+name);
            console.log(name, (bytes.length/1024).toFixed(0), 'KB', 'validado');
          }
          JS

      - name: Auditar que se publica juego real, no una portada
        run: |
          test -s website/aislamiento-15/index.html
          test -s website/aislamiento-15/isolation-static-entry.js
          test -s website/aislamiento-15/isolation-static-entry.css
          test -s website/aislamiento-15/cover.svg
          test -s website/aislamiento-15/models/hospital-bed-flat.glb
          test -s website/aislamiento-15/models/medical-headwall.glb
          test -s website/aislamiento-15/models/warden.glb
          test -s website/aislamiento-15/models/supply-cart.glb
          test -s website/aislamiento-15/models/vital-monitor.glb
          node --input-type=module <<'JS'
          import {readFile,stat} from 'node:fs/promises';
          const original = await readFile('source/src/app/aislamiento-15/IsolationWorld.ts','utf8');
          const logic = await readFile('source/src/app/aislamiento-15/IsolationGame.tsx','utf8');
          const js = await stat('website/aislamiento-15/isolation-static-entry.js');
          const css = await readFile('website/aislamiento-15/isolation-static-entry.css','utf8');
          for (const token of ['GLTFLoader','WebGLRenderer','buildEmergency','buildIsolation','buildContainment','getFocus']) {
            if(!original.includes(token))throw new Error('Falta implementación 3D: '+token);
          }
          for (const token of ['SECONDS = 900','chooseVoice','interactWith','onCaught','onChamber']) {
            if(!logic.includes(token))throw new Error('Falta gameplay: '+token);
          }
          if(js.size < 400000)throw Error('Bundle 3D demasiado pequeño');
          if(!css.includes('.iso-joystick'))throw Error('Sin control táctil');
          console.log('React + Three.js, 3 sectores, cronómetro, amenaza, enigmas y controles presentes.');
          JS

      - name: Publicar únicamente aislamiento-15 sin alterar las otras experiencias
        run: |
          git -C website config user.name 'github-actions[bot]'
          git -C website config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          touch website/.nojekyll
          git -C website add aislamiento-15 .nojekyll
          if git -C website diff --cached --quiet; then
            echo 'La versión pública ya está actualizada.'
          else
            git -C website commit -m 'deploy: Aislamiento 15 escape room Three.js premium'
            # Another workflow may commit to main during this build. Rebase rather than
            # force-push: preserve every other escape room and the Pages settings.
            for attempt in 1 2 3 4; do
              git -C website fetch origin main
              git -C website rebase origin/main
              if git -C website push origin HEAD:main; then
                echo 'Deployment published safely at attempt' "$attempt"
                break
              fi
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep 2
            done
          fi

<script>
/* CASA VIVA / EXPEDIENTE 001 — motor original de juego.
   Reconocimiento opcional: TensorFlow.js + coco-ssd (Apache-2.0).
   Las imágenes de cámara se procesan localmente. No hay backend ni subida de video.
*/
const $ = (s) => document.querySelector(s);
const screen = $('#screen');
const camera = $('#camera');
const soundButton = $('#sound-btn');
const storageKey = 'casaviva-001-v1';
const DURATION = 14 * 60 * 1000;
const OBJECTS = Object.freeze({
  'book': ['libro','▤'], 'chair':['silla','♜'], 'tv':['televisor','▣'],
  'bottle':['botella','♧'], 'cup':['taza','◡'], 'clock':['reloj','◷'],
  'potted plant':['planta','✳'], 'laptop':['computadora','⌑'],
  'couch':['sofá','▰'], 'bed':['cama','▱'], 'dining table':['mesa','▰'],
  'remote':['control remoto','⌁'], 'cell phone':['celular','▯'],
  'teddy bear':['oso de peluche','♟'], 'refrigerator':['heladera','▣'],
  'vase':['florero','♧'], 'keyboard':['teclado','▤'],
  'sink':['pileta','◡'], 'microwave':['microondas','□']
});
const DEMO_OBJECTS = [
  ['chair','book','cup','bottle'],
  ['tv','potted plant','clock','couch'],
  ['laptop','dining table','bed','teddy bear']
];
const INTRO = [
  'A las 03:17 se recibió una llamada desde una casa vacía.',
  'Nadie habló. Solo se escucharon tres golpes y una voz que repetía: «No mires detrás de vos».',
  'La llamada vino de tu dirección. Necesitamos encontrar las tres marcas antes de que la señal desaparezca.'
];
const EVIDENCE = [
  {title:'EL PRIMER GOLPE',text:'En la grabación aparece una sombra donde no debería haber nadie. La señal respondió a un objeto de esta habitación. Es la primera marca.',whisper:'«Uno de ustedes abrió la puerta...»'},
  {title:'LA VOZ ENTRE PAREDES',text:'La frecuencia acaba de cambiar. Otra marca apareció donde la cámara miró. La voz pronuncia una frase imposible: «Yo todavía vivo acá».',whisper:'«Ya sabe que estás buscando.»'},
  {title:'LA TERCERA MARCA',text:'La transmisión está llegando a su fin. Hay tres objetos registrados. Sus nombres esconden la única combinación capaz de cerrar la señal.',whisper:'«No abras cuando escuchen los tres golpes.»'}
];
const escapeHtml = (s) => String(s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validObject = (value) => Object.prototype.hasOwnProperty.call(OBJECTS,value);
const cleanState = (data) => {
  if (!data || !['prologue','scan','evidence','lock','win','lost'].includes(data.phase)) return null;
  if (!['demo','live',null].includes(data.mode)) return null;
  if (!Array.isArray(data.found) || data.found.length>3 || !data.found.every(validObject) || new Set(data.found).size!==data.found.length) return null;
  if (!Number.isFinite(data.startedAt) && data.startedAt!==null) return null;
  return {phase:data.phase,mode:data.mode,found:data.found,startedAt:data.startedAt,muted:Boolean(data.muted),errors:0};
};
const loadState = () => {try {return cleanState(JSON.parse(localStorage.getItem(storageKey)))}catch{return null}};
let state = loadState() || {phase:'home',mode:null,found:[],startedAt:null,muted:false,errors:0};
let detector = null, cameraStream = null, scanEpoch = 0, lastSeen = null, consecutive = 0;
let cameraStatus = 'idle', modelStatus = 'idle', recentCandidate = null, lockMessage = '';
let audioCtx = null, drone = null, toastTimer = null;

function save(){ try{localStorage.setItem(storageKey,JSON.stringify({phase:state.phase,mode:state.mode,found:state.found,startedAt:state.startedAt,muted:state.muted}))}catch{} }
function remaining(){return Math.max(0,DURATION-(Date.now()-(state.startedAt||Date.now())))}
function timeString(){const t=Math.ceil(remaining()/1000);return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}
function digitFor(className){const letters=OBJECTS[className][0].replace(/[^a-záéíóúñ]/gi,'').length;return (letters-1)%9+1}
function codeFor(){return state.found.map(digitFor).join('')}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3400)}
function audioUnlock(){if(state.muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx ||= new AC();if(audioCtx.state!=='running')audioCtx.resume().catch(()=>{});}catch{}}
function note(freq=145,duration=.4,type='sine',vol=.065){if(!audioCtx || audioCtx.state!=='running'||state.muted)return;const now=audioCtx.currentTime;const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);osc.frequency.exponentialRampToValueAtTime(Math.max(45,freq*.61),now+duration);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(vol,now+.03);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.05)}
function sound(type){if(type==='clue'){note(214,1.1,'triangle',.07);setTimeout(()=>note(143,.8,'sine',.045),260)}else if(type==='wrong'){note(82,.6,'sawtooth',.038)}else if(type==='win'){note(262,.8,'sine',.05);setTimeout(()=>note(392,1.6,'sine',.06),280)}else{note(97,.65,'triangle',.04)}}
function stopCamera(){scanEpoch++;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}camera.srcObject=null;cameraStatus='idle';lastSeen=null;recentCandidate=null;consecutive=0;document.body.classList.remove('scan-live')}
function reset(){stopCamera();state={phase:'home',mode:null,found:[],startedAt:null,muted:state.muted,errors:0};lockMessage='';save();render()}
function startPrologue(){state.phase='prologue';state.found=[];state.startedAt=null;state.mode=null;save();audioUnlock();sound('press');render()}
function selectMode(mode){state.mode=mode;state.phase='scan';state.startedAt=Date.now();state.errors=0;save();audioUnlock();sound('press');render();if(mode==='live')startLiveScanner()}
function nextEvidence(){if(state.found.length>=3){state.phase='lock'}else{state.phase='scan'}save();render();if(state.phase==='scan'&&state.mode==='live')startLiveScanner()}
function recordObject(className){if(state.phase!=='scan'||!validObject(className)||state.found.includes(className))return;
  if(state.mode==='live'&&(!recentCandidate||recentCandidate.className!==className||Date.now()-recentCandidate.time>4000)){toast('La cámara necesita detectar el objeto primero.');return;}
  if(state.mode==='live')stopCamera();else scanEpoch++;state.found.push(className);state.phase='evidence';save();sound('clue');if(navigator.vibrate)navigator.vibrate([70,30,130]);render();}
function checkCode(){const inputs=[...document.querySelectorAll('.code-input')];const code=inputs.map(n=>n.value).join('');if(code.length!==3){lockMessage='Introducí las tres cifras para descifrar la señal.';sound('wrong');render();return}
  if(code===codeFor()){stopCamera();state.phase='win';save();sound('win');render()}
  else{state.errors+=1;lockMessage='CÓDIGO INCORRECTO · La voz está más cerca.';sound('wrong');render();setTimeout(()=>$('.code-input')?.focus(),100)} }
function startCountdown(){return `<span class="time-update${remaining()<90000?' timer-warning':''}">${timeString()}</span>`}
function hud(){return `<div class="hud"><span class="chip ${state.mode==='live'?'live':''}">${state.mode==='live'?'● CÁMARA REAL':'◌ DEMOSTRACIÓN'}</span><span>INDICIO ${Math.min(state.found.length+1,3)}/3</span><span class="hud-time time-update">${timeString()}</span></div>`}
function render(){document.body.classList.toggle('scan-live',state.phase==='scan'&&state.mode==='live'&&Boolean(cameraStream));soundButton.textContent=state.muted?'♩':'♫';soundButton.setAttribute('aria-label',state.muted?'Activar sonido':'Silenciar sonido');
  if(state.phase==='home')return renderHome();if(state.phase==='prologue')return renderPrologue();if(state.phase==='scan')return renderScan();if(state.phase==='evidence')return renderEvidence();if(state.phase==='lock')return renderLock();if(state.phase==='win')return renderWin();if(state.phase==='lost')return renderLost();}
function renderHome(){screen.innerHTML=`<section class="stage home-grid"><div class="home-copy"><p class="eyebrow">UNA EXPERIENCIA DE TERROR EN TU PROPIA CASA</p><h1 class="hero-title"><span>CASA</span><span class="thin">VIVA.</span></h1><h2 class="episode">LA ÚLTIMA SEÑAL</h2><p class="desc">A las <strong>03:17</strong>, una casa vacía hizo una llamada. El número era el tuyo. <strong>Encontrá las tres marcas</strong> escondidas entre tus objetos antes de que termine la transmisión.</p><div class="button-row"><button class="button" data-action="begin">ABRIR EXPEDIENTE <span>↗</span></button>${loadState()&&state.mode?'<button class="button secondary" data-action="continue">CONTINUAR ↗</button>':''}</div><p class="hintline">EPISODIO 001 · 10–14 MIN · 1 JUGADOR · AURICULARES RECOMENDADOS</p></div><div class="hero-art" aria-hidden="true"><div class="door-scene"><div class="door-frame"></div><div class="figure"></div></div><div class="art-cross">+</div><div class="art-caption">CAM 01 · SIN SEÑAL · 03:17:04</div><div class="art-corner"></div></div></section>`}
function renderPrologue(){screen.innerHTML=`<section class="stage"><article class="panel"><div class="eyebrow">DOCUMENTO RECUPERADO / CÁMARA 01</div><h1 class="panel-title">La llamada vino<br/>de <span class="accent">tu casa.</span></h1><div class="transmission"><p>${INTRO.join('<br/><br/>')}</p></div><div class="rules"><div class="rule"><b>01/</b><span>Encontrá tres objetos usando la cámara. Cada uno revela una marca.</span></div><div class="rule"><b>02/</b><span>Los nombres de los objetos forman el código final. Prestá atención a las pistas.</span></div><div class="rule"><b>03/</b><span>Tenés 14 minutos para cerrar la transmisión. No hace falta correr, apagar luces ni desplazarse por lugares peligrosos.</span></div></div><p class="small-print">La cámara se procesa en el dispositivo y no guardamos imágenes. Para detectar objetos se descargan librerías y un modelo de IA. Este episodio contiene tensión sonora y sustos leves; podés desactivar el sonido.</p><p class="monospace micro-accent">ELEGÍ CÓMO JUGAR</p><div class="mode-chooser"><button class="mode-card" data-action="choose-live"><span class="mode-icon">⌾</span><strong>USAR CÁMARA REAL</strong><span>Reconocimiento de objetos con IA. Requiere conexión y permiso de cámara.</span></button><button class="mode-card" data-action="choose-demo"><span class="mode-icon">◇</span><strong>JUGAR DEMOSTRACIÓN</strong><span>La historia completa sin cámara, con objetos seleccionados manualmente.</span></button></div><button class="button ghost" data-action="reset">← VOLVER</button></article></section>`}
function renderScan(){const index=state.found.length;
const stages=[{title:'LA PRIMERA MARCA',sub:'Buscá un objeto cotidiano. La cámara detectará su forma; la primera señal aparecerá cuando lo confirme.',line:'«Se movió algo. No estabas solo.»'},
{title:'ALGUIEN RESPONDIÓ',sub:'Encontrá otro objeto distinto. La transmisión se está rearmando con lo que hay a tu alrededor.',line:'«No está en la pantalla. Está en la casa.»'},
{title:'ÚLTIMO CONTACTO',sub:'Falta un tercer objeto distinto. Después deberás descifrar el código antes de que la señal desaparezca.',line:'«Tres nombres. Una sola salida.»'}];
const st=stages[index]||stages[2];const active=state.mode==='live';let center='⌾',label=active?'ESPERANDO IMAGEN DE LA CÁMARA':'SIMULACIÓN · ELEGÍ UN OBJETO';if(active&&cameraStatus==='ready'){label=recentCandidate?`DETECTADO: ${OBJECTS[recentCandidate.className][0].toUpperCase()} · ${Math.round(recentCandidate.score*100)}%`:modelStatus==='ready'?'APUNTÁ A UN OBJETO COMÚN':'CARGANDO RECONOCIMIENTO...'}else if(active&&cameraStatus==='loading'){label='SOLICITANDO ACCESO A LA CÁMARA'}else if(active&&cameraStatus==='error'){label='CÁMARA NO DISPONIBLE'}
const options=DEMO_OBJECTS[index].map(obj=>`<button class="demo-option" data-action="pick-demo" data-object="${obj}" ${state.found.includes(obj)?'disabled':''}>${escapeHtml(OBJECTS[obj][0].toUpperCase())}<small>SELECCIONAR EVIDENCIA ↗</small></button>`).join('');
screen.innerHTML=`<section class="stage scan-stage">${hud()}<div class="scan-head"><div class="eyebrow" style="justify-content:center">FRECUENCIA 03:17 · ${String(index+1).padStart(2,'0')}/03</div><h1 class="scan-title">${st.title}</h1><p class="scan-sub">${st.sub}</p></div><div class="scanner-window"><div class="scanner-corners"></div><div class="scan-line"></div><div class="scan-center"><span class="scan-symbol">${center}</span><span class="scan-label">${label}</span></div></div><div class="scan-bottom"><div class="scan-feedback">${st.line}</div>${active?`${recentCandidate?`<button class="button" data-action="claim" data-object="${recentCandidate.className}">REGISTRAR ${escapeHtml(OBJECTS[recentCandidate.className][0].toUpperCase())} ↗</button>`:`<div class="monospace" style="font-size:10px;color:#c5aaa3">${cameraStatus==='error'?'Reintentá con HTTPS y permiso de cámara':modelStatus==='loading'?'Descargando modelo IA...':'Objetos compatibles: libro, silla, taza, televisor, planta, reloj...'}</div>`}${cameraStatus==='error'||cameraStatus==='idle'?'<button class="button secondary small" data-action="retry-camera">ACTIVAR CÁMARA ↗</button>':''}<button class="button ghost small" data-action="switch-demo">USAR MODO DEMOSTRACIÓN</button>`:`<div class="demo-options">${options}</div><span class="small-print">DEMOSTRACIÓN: estas elecciones no fueron reconocidas por una cámara.</span>`}</div></section>`}
function renderEvidence(){const index=state.found.length-1;const clue=EVIDENCE[index];const obj=state.found[index];const name=OBJECTS[obj][0];const glyph=OBJECTS[obj][1];const digit=digitFor(obj);screen.innerHTML=`<section class="stage"><div class="evidence-layout"><div class="evidence-card"><span class="evidence-index">EVIDENCIA / 00${index+1}</span><span class="evidence-glyph">${glyph}</span><span class="evidence-note">OBJETO: ${escapeHtml(name.toUpperCase())}<br/>FRECUENCIA: 03:17 · MARCA CONFIRMADA</span></div><article><p class="eyebrow">TRANSMISIÓN INTERCEPTADA</p><h1 class="panel-title">${clue.title}</h1><p class="panel-text">${clue.text} Detectaste: <strong style="color:#fff">${escapeHtml(name)}</strong>.</p><div class="transmission"><p>${clue.whisper}</p></div><div class="chip" style="margin-top:8px">MARCA 0${index+1} / ${escapeHtml(name.toUpperCase())}</div><div><span class="digit" title="Cifra recuperada">${digit}</span></div><p class="panel-text" style="font-size:13px">Cifra recuperada: <strong>${digit}</strong>. Anotala. Cada cifra surge de contar las letras del nombre del objeto (si supera nueve, sumá sus dígitos).</p><div class="button-row"><button class="button" data-action="next">${index===2?'ABRIR CERRADURA':'RASTREAR SIGUIENTE MARCA'} ↗</button></div></article></div></section>`}
function renderLock(){lockMessage ||= '';screen.innerHTML=`<section class="stage"><article class="panel" style="text-align:center"><p class="eyebrow" style="justify-content:center">03 EVIDENCIAS RECUPERADAS · ACCESO FINAL</p><div class="end-symbol" aria-hidden="true">⌑</div><h1 class="panel-title">La puerta está<br/><span class="accent">del otro lado.</span></h1><p class="panel-text">Escuchás tres golpes detrás de la pared. La voz vuelve a hablar: «Decí los tres números, en el mismo orden en que me encontraste».</p><div class="clue-grid" style="justify-content:center">${state.found.map((obj,i)=>`<span class="clue-chip">0${i+1} · ${escapeHtml(OBJECTS[obj][0].toUpperCase())}</span>`).join('')}</div><div class="lock-hint">Cada número corresponde a la cantidad de letras del nombre de un objeto. Si el número tiene dos cifras, sumalas hasta obtener una sola cifra. Ejemplo: 14 letras → 1 + 4 = 5.</div><form id="lock-form" novalidate><div class="code-inputs"><input class="code-input" data-digit="0" inputmode="numeric" type="text" pattern="[0-9]*" maxlength="1" aria-label="Primera cifra" autocomplete="off"/><input class="code-input" data-digit="1" inputmode="numeric" type="text" pattern="[0-9]*" maxlength="1" aria-label="Segunda cifra" autocomplete="off"/><input class="code-input" data-digit="2" inputmode="numeric" type="text" pattern="[0-9]*" maxlength="1" aria-label="Tercera cifra" autocomplete="off"/></div><button class="button" type="submit">CERRAR LA SEÑAL ↗</button></form><p id="lock-error" class="micro-accent monospace" role="alert" style="min-height:18px;margin:20px 0">${escapeHtml(lockMessage)}</p><p class="hintline">TIEMPO RESTANTE <span class="time-update">${timeString()}</span> · INTENTOS ${state.errors}</p></article></section>`}
function renderWin(){const elapsed=Math.max(0,Math.round((Date.now()-state.startedAt)/1000));const minutes=Math.floor(elapsed/60);const seconds=String(elapsed%60).padStart(2,'0');screen.innerHTML=`<section class="stage"><article class="panel" style="text-align:center"><p class="eyebrow" style="justify-content:center">ARCHIVO 001 / CERRADO</p><div class="end-symbol">✳</div><h1 class="panel-title">La casa volvió<br/>a estar <span class="accent">en silencio.</span></h1><div class="transmission"><p>La frecuencia muere a las 03:17. En la grabación final se escucha tu propia voz, diciendo algo que todavía no dijiste: «Nos vemos mañana».</p></div><p class="panel-text">Sobreviviste a <strong>LA ÚLTIMA SEÑAL</strong>. Pero la llamada no terminó: solamente cambió de destinatario.</p><div class="end-stat"><div class="stat"><strong>${state.found.length}/3</strong><small>MARCAS ENCONTRADAS</small></div><div class="stat"><strong>${minutes}:${seconds}</strong><small>TIEMPO DE PARTIDA</small></div></div><button class="button" data-action="reset">JUGAR DE NUEVO ↗</button><p class="hintline">FIN DEL EPISODIO 001 · CONTINUARÁ</p></article></section>`}
function renderLost(){screen.innerHTML=`<section class="stage"><article class="panel" style="text-align:center"><p class="eyebrow" style="justify-content:center">TRANSMISIÓN INTERRUMPIDA</p><div class="end-symbol">⌁</div><h1 class="panel-title">Se terminó<br/><span class="accent">el tiempo.</span></h1><p class="panel-text">La frecuencia desapareció sin que pudieras cerrar la señal. A las 03:18 alguien vuelve a llamar.</p><button class="button" data-action="reset">REINICIAR EXPEDIENTE ↗</button></article></section>`}

async function injectScript(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.async=true;s.crossOrigin='anonymous';s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo descargar una librería de reconocimiento.'));document.head.appendChild(s)})}
async function loadDetector(){if(detector)return detector;modelStatus='loading';render();
  if(!window.tf)await injectScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
  if(!window.cocoSsd)await injectScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');
  await window.tf.ready();detector=await window.cocoSsd.load({base:'lite_mobilenet_v2'});modelStatus='ready';return detector;}
async function startLiveScanner(){if(state.phase!=='scan'||state.mode!=='live')return;
  const epoch=++scanEpoch;cameraStatus='loading';recentCandidate=null;consecutive=0;render();try{
    if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia)throw new Error('La cámara necesita HTTPS o localhost y un navegador compatible.');
    if(!cameraStream){cameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:720}}});}
    if(epoch!==scanEpoch){if(cameraStream)stopCamera();return}
    camera.srcObject=cameraStream;await camera.play();cameraStatus='ready';render();
    await loadDetector();if(epoch!==scanEpoch)return;render();void scanLoop(epoch);
  }catch(e){if(epoch!==scanEpoch)return;stopCamera();cameraStatus='error';modelStatus='error';render();toast(e.message?.includes('Permission')||e.name==='NotAllowedError'?'El navegador no recibió permiso para usar la cámara.':(e.message||'No se pudo inicializar la cámara.'));}}
async function scanLoop(epoch){if(epoch!==scanEpoch||state.phase!=='scan'||state.mode!=='live'||!cameraStream)return;
  try {if(camera.readyState>=2){const items=await detector.detect(camera,10,.55);if(epoch!==scanEpoch)return;
    const candidate=items.filter(it=>validObject(it.class)&&!state.found.includes(it.class)).sort((a,b)=>b.score-a.score)[0];
    if(candidate){const item=candidate.class;if(lastSeen===item)consecutive++;else{lastSeen=item;consecutive=1;recentCandidate=null;render()}if(consecutive>=2){recentCandidate={className:item,score:candidate.score,time:Date.now()};render();}}
    else{lastSeen=null;consecutive=0;if(recentCandidate&&Date.now()-recentCandidate.time>3600){recentCandidate=null;render();}}
  }}catch(e){modelStatus='error';cameraStatus='error';render();toast('La detección falló. Podés reintentar o usar la demostración.');return}
  if(epoch===scanEpoch)setTimeout(()=>void scanLoop(epoch),1050);
}
function switchDemo(){stopCamera();state.mode='demo';modelStatus='idle';save();render();toast('Modo demostración activado: sin reconocimiento de cámara.');}
function tick(){if(state.startedAt&&['scan','evidence','lock'].includes(state.phase)){
  if(remaining()===0){stopCamera();state.phase='lost';save();sound('wrong');render();return}
  document.querySelectorAll('.time-update').forEach(el=>{el.textContent=timeString();el.classList.toggle('timer-warning',remaining()<90000)});
}}
function delegatedClick(event){const b=event.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
  if(action==='begin')startPrologue();else if(action==='reset')reset();else if(action==='choose-live')selectMode('live');else if(action==='choose-demo')selectMode('demo');else if(action==='pick-demo'&&state.mode==='demo')recordObject(b.dataset.object);else if(action==='claim'&&state.mode==='live')recordObject(b.dataset.object);else if(action==='next')nextEvidence();else if(action==='retry-camera')startLiveScanner();else if(action==='switch-demo')switchDemo();else if(action==='continue'){render();if(state.phase==='scan'&&state.mode==='live')toast('Tocá ACTIVAR CÁMARA para reanudar el reconocimiento.');}}
screen.addEventListener('click',delegatedClick);
screen.addEventListener('submit',e=>{if(e.target.id==='lock-form'){e.preventDefault();checkCode()}});
screen.addEventListener('input',e=>{if(e.target.matches('.code-input')){e.target.value=e.target.value.replace(/\D/g,'').slice(-1);if(e.target.value){const i=Number(e.target.dataset.digit);document.querySelector(`.code-input[data-digit="${i+1}"]`)?.focus();}}});
screen.addEventListener('keydown',e=>{if(e.target.matches('.code-input')&&e.key==='Backspace'&&!e.target.value){const i=Number(e.target.dataset.digit);document.querySelector(`.code-input[data-digit="${i-1}"]`)?.focus();}});
soundButton.addEventListener('click',()=>{state.muted=!state.muted;save();if(!state.muted){audioUnlock();sound('press')}soundButton.textContent=state.muted?'♩':'♫';soundButton.setAttribute('aria-label',state.muted?'Activar sonido':'Silenciar sonido');toast(state.muted?'Sonido desactivado':'Sonido activado')});
window.addEventListener('pagehide',()=>{if(cameraStream)stopCamera()});
window.addEventListener('visibilitychange',()=>{if(document.hidden&&cameraStream){scanEpoch++;cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;cameraStatus='idle';recentCandidate=null;consecutive=0}else if(!document.hidden&&state.phase==='scan'&&state.mode==='live'){render();toast('Tocá ACTIVAR CÁMARA para continuar.')}});
setInterval(tick,1000);
render();tick();
/* Surface for local QA and deterministic rules checks; not enabled on public deployments. */
if(['localhost','127.0.0.1'].includes(location.hostname)){window.__CASA_VIVA_QA__={digitFor,codeFor,getState:()=>({...state}),forceLiveEvidence:(o)=>{recentCandidate={className:o,score:.99,time:Date.now()};recordObject(o)}};}

</script>
